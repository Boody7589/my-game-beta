<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حلم الشهرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#14103A;--bar:#1C1550;--panel:#231B5A;--panel2:#2A2070;--line:#3A2F96;--line2:#4B3FA8;
  --deep:#0E0A2B;--ink:#F4F1FF;--muted:#C9C1F5;--dim:#8D83DB;
  --red:#FF4D5E;--gold:#FFC93C;--teal:#35E0C0;--blue:#5AB0FF;--pink:#FF7AC6;--violet:#B9A8FF;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14103A}}
:root[data-theme="dark"]{--bg:#14103A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.disp{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:12px 24px;background:var(--bar);border-bottom:3px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;padding-inline-end:12px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--red);border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--bg);flex:none}
.who-name{font-size:24px;line-height:1.1}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lvl b{background:var(--gold);color:var(--bg);padding:1px 10px;border-radius:999px;font-weight:800}
.stat{display:flex;flex-direction:column;background:var(--panel2);border:2px solid var(--line2);border-radius:14px;padding:6px 16px;min-width:118px}
.stat .sl{font-size:13px;color:var(--muted)}
.stat .sv{display:flex;align-items:baseline;gap:8px;font-family:'Lalezar',sans-serif;font-size:25px;line-height:1.15}
.stat small{font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800}
.meters{display:flex;flex-direction:column;gap:6px;min-width:190px;margin-inline-start:auto}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.meter span:first-child{width:44px;color:var(--muted)}
.meter b{width:30px}
.bar-t{flex:1;height:12px;border-radius:999px;background:var(--deep);overflow:hidden;min-width:60px}
.bar-t i{display:block;height:100%}
.clock{display:flex;flex-direction:column;align-items:center;background:var(--deep);border:2px solid var(--gold);border-radius:14px;padding:6px 18px}
.clock small{font-size:13px;color:var(--muted)}
.clock b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:25px;color:var(--gold);line-height:1.1}
.sq{width:48px;height:48px;border-radius:14px;border:2px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}

/* body */
.body{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:16px;padding:16px 24px;max-width:1640px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-inline-start:auto}

.task{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:8px 12px}
.task .tb{min-width:44px;height:28px;border-radius:8px;border:3px solid var(--dim);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;padding:0 4px}
.task.done .tb{background:var(--teal);border-color:var(--teal);color:var(--bg);font-size:16px}
.task .tt{flex:1;font-size:15px;font-weight:700}
.task .tr{font-size:13px;font-weight:800;color:var(--gold)}
.met{display:flex;flex-direction:column;gap:4px}
.met .mh{display:flex;justify-content:space-between;font-size:14px}

/* scene */
.scene{position:relative;border:3px solid var(--line);border-radius:20px;overflow:hidden;background:#2A2166;aspect-ratio:730/450}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);min-height:44px;padding:4px 14px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800;font-size:15px;border:3px solid var(--gold);white-space:nowrap}
.chips{position:absolute;bottom:12px;inset-inline-start:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip-s{background:var(--bg);border:2px solid;border-radius:999px;font-weight:800;font-size:13px;padding:2px 12px}
.gold-note{position:absolute;bottom:12px;inset-inline-end:14px;background:var(--bg);border:2px solid var(--red);border-radius:999px;font-weight:700;font-size:13px;padding:2px 12px}

.pipe-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tag{background:var(--panel2);border:2px solid var(--line2);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stg{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;border:3px solid var(--line2);background:var(--bar)}
.stg.done{background:#1E3A5E;border-color:var(--teal)}
.stg.cur{background:#3A3470;border-color:var(--gold)}
.stg small{font-size:12px;color:var(--muted)}
.stg b{font-size:17px}

/* right column */
.trend .th{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.trend .th span:last-child{font-size:12px;font-weight:800;white-space:nowrap}
.cm{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.cm .ch{display:flex;align-items:center;gap:8px}
.cm .ch b{font-size:13px}
.cm .tg{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;color:var(--bg)}
.cm p{font-size:14px;line-height:1.5}
.cm .ca{display:flex;gap:8px}
.mini{min-height:36px;padding:4px 14px;border-radius:999px;border:2px solid var(--teal);background:transparent;color:var(--teal);font-weight:800;font-size:13px}
.mini.alt{border-color:var(--line2);color:var(--muted);font-weight:700}
.spons{background:var(--gold);color:var(--bg);border:3px solid var(--bg);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #B9822A}
.spons h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:22px}
.spons .sb{display:flex;gap:8px}
.spons button{flex:1;min-height:44px;border-radius:12px;border:3px solid var(--bg);background:transparent;color:var(--bg);font-weight:800;font-size:15px}
.spons button.main{background:var(--bg);color:var(--gold)}
.empty{border:3px dashed var(--line2);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* actions */
.actions{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;padding:12px 24px 16px;background:var(--bar);border-top:3px solid var(--line)}
.act{flex:1 1 120px;min-height:64px;border-radius:16px;border:3px solid;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px}
.act .an{font-family:'Lalezar',sans-serif;font-size:22px;line-height:1.1}
.act .ac{font-size:13px;font-weight:700}
.end{flex:1 1 170px;min-height:64px;border-radius:16px;border:3px solid var(--bg);background:var(--red);color:var(--bg);font-family:'Lalezar',sans-serif;font-size:26px;box-shadow:0 6px 0 #9E2230}

/* overlay */
.overlay{position:fixed;inset:0;z-index:58;background:rgba(14,10,43,.82);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:920px;background:var(--panel);border:3px solid var(--line2);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.sheet:focus{outline:none}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:30px}
.sheet-h .x{margin-inline-start:auto;min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);font-weight:800;padding:0 16px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{padding:6px 16px;border-radius:999px;font-weight:800;font-size:14px;border:3px solid var(--line2);background:var(--bar);color:var(--muted)}
.step.done{background:#1E3A5E;border-color:var(--teal);color:var(--teal)}
.step.cur{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chipb{min-height:44px;padding:4px 16px;border-radius:999px;font-weight:800;font-size:15px;border:3px solid var(--line2);background:var(--panel2)}
.chipb[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.opt{display:flex;flex-direction:column;gap:2px;text-align:start;min-height:44px;padding:8px 14px;border-radius:14px;border:3px solid var(--line2);background:var(--panel2)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#1E3A5E}
.opt b{font-size:15px}
.opt span{font-size:12px;color:var(--muted)}
.btn{min-height:52px;padding:6px 22px;border-radius:14px;border:3px solid var(--bg);background:var(--gold);color:var(--bg);font-family:'Lalezar',sans-serif;font-size:22px;box-shadow:0 5px 0 #B9822A}
.btn.red{background:var(--red);box-shadow:0 5px 0 #9E2230}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2);box-shadow:none;font-family:'Tajawal',sans-serif;font-weight:800;font-size:15px}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 #1D9C86}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gear{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:3px solid var(--line2);border-radius:16px;padding:12px}
.gear.max{border-color:var(--teal)}
.gi{width:40px;height:40px;border-radius:12px;color:var(--bg);font-family:'Lalezar',sans-serif;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:8px;border-radius:999px;background:var(--deep)}
.pips i.on{background:var(--gold)}
.sk{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:3px solid;border-radius:16px;padding:12px}
.node{display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:start;padding:8px 10px;border-radius:10px;border:2px solid var(--line2);background:var(--bar)}
.node.on{background:#1E3A5E;border-color:var(--teal)}
.node.open{background:#3A3470;border-color:var(--gold)}
.node span{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-bottom:6px;border-bottom:3px solid var(--line)}
.chart i{flex:1;border-radius:6px 6px 0 0;background:var(--blue);min-height:6px}
.rv{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:var(--panel2)}
.rv.me{background:var(--gold);color:var(--bg)}
.rv b:first-child{width:28px;font-family:'Lalezar',sans-serif;font-weight:400;font-size:20px}
.ach{display:flex;align-items:center;gap:10px}
.ach i{width:36px;height:36px;border-radius:10px;border:2px solid var(--line2);background:var(--deep);color:var(--dim);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;flex:none}
.ach.on i{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.ev{background:var(--red);color:var(--bg);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
input.txt{min-height:48px;width:100%;border-radius:12px;border:3px solid var(--line2);background:var(--deep);padding:6px 14px}
label.lb{font-weight:800;font-size:14px}

/* toasts */
.toasts{position:fixed;z-index:70;inset-inline:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--bg);border:3px solid var(--teal);border-radius:14px;padding:8px 16px;font-weight:700;font-size:15px;max-width:560px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.toast.warn{border-color:var(--red)}
.toast.gold{border-color:var(--gold)}


/* boot */
.boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.boot.out{opacity:0;transition:opacity .4s}
.boot-in{position:relative;z-index:2;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rec{position:absolute;top:-8px;inset-inline-end:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:1px;color:var(--red)}
.rec i{width:12px;height:12px;border-radius:50%;background:var(--red)}
.logo{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.logo .ring{position:absolute;inset:0;width:100%;height:100%}
.logo .play{width:112px;height:auto;position:relative}
.bt{font-size:clamp(44px,12vw,72px);line-height:1.05;color:var(--red);text-shadow:0 0 22px rgba(255,77,94,.55),0 4px 0 #9E2230}
.bs{font-size:18px;color:var(--muted);font-weight:700}
.bl{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bl-bar{position:relative;height:18px;border-radius:999px;background:var(--deep);border:3px solid var(--line2)}
.bl-bar i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:999px;background:var(--red)}
.bl-bar i::after{content:'';position:absolute;inset-inline-end:-3px;top:-8px;bottom:-8px;width:6px;border-radius:3px;background:var(--gold)}
.bl-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);min-height:24px}
.bl-subs b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:22px;color:var(--gold)}
.rise{position:absolute;z-index:1;bottom:-60px;padding:4px 14px;border-radius:999px;border:2px solid var(--line2);background:var(--panel2);font-weight:800;font-size:14px;color:var(--muted);opacity:0}
@media (prefers-reduced-motion:no-preference){
  .rec i{animation:blink 1s steps(2,jump-none) infinite}
  .logo .ring{animation:spin 8s linear infinite}
  .logo .play{animation:beat 1.6s ease-in-out infinite}
  .rise{animation:rise 7s linear infinite}
  @keyframes blink{50%{opacity:.15}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes beat{50%{transform:scale(1.08)}}
  @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}85%{opacity:.9}100%{transform:translateY(-110vh);opacity:0}}
}
@media (prefers-reduced-motion:reduce){.rise{opacity:.35;bottom:auto}}

@media (max-width:1180px){
  .body{grid-template-columns:minmax(0,1fr);padding:12px}
  .mid{order:-1}
  .top{padding:10px 12px}
  .actions{padding:10px 12px 14px}
  .meters{margin-inline-start:0;flex:1 1 100%}
}
@media (max-width:760px){
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .hot{display:none}
  .stat{flex:1 1 40%}
  .chips{position:static;padding:8px;background:var(--bg)}
  .gold-note{display:none}
  .scene{aspect-ratio:730/450}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}

/* main menu */
.mm{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.mm[hidden]{display:none}
.mm-in{position:relative;z-index:2;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin:auto 0}
.mm-btns{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:10px}
.mm-btns .btn{width:100%}
.mm-sub{font-size:13px;color:var(--muted);margin-top:-6px}
.credit{font-size:14px;color:var(--muted);margin-top:14px;line-height:1.7}
.credit bdi{color:var(--gold);font-weight:800;font-size:16px}
body.large{zoom:1.12}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation:none!important;transition:none!important}
body.nomotion .rise{opacity:.3;bottom:auto}

/* mobile */
@media (max-width:760px){
  .top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 12px}
  .who{grid-column:1/-1;padding:0}
  .avatar{width:44px;height:44px;font-size:24px;border-width:3px}
  .who-name{font-size:20px}
  .stat{grid-column:span 2;min-width:0;padding:4px 10px}
  .stat .sv{font-size:21px}
  .meters{grid-column:1/-1;min-width:0;margin:0}
  .clock{grid-column:span 2;flex-direction:row;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px}
  .top .sq{width:100%;height:46px}
  .body{gap:12px;padding:10px}
  .col{gap:12px}
  .left{order:2}
  .panel{padding:12px;border-radius:16px}
  .scene{border-radius:16px}
  .chips{position:absolute;bottom:6px;inset-inline-start:8px;gap:6px;padding:0;background:transparent}
  .chip-s{font-size:11px;padding:1px 8px}
  .gold-note{display:block;bottom:auto;top:6px;inset-inline-end:8px;font-size:11px;padding:1px 8px}
  .actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
  .act{flex:none;min-height:56px;padding:4px 2px;border-radius:12px;border-width:2px}
  .act .an{font-size:17px}
  .act .ac{font-size:11px}
  .end{grid-column:span 2;min-height:56px;font-size:22px;border-radius:12px;flex:none}
  .toasts{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
  .overlay{padding:8px}
  .sheet{padding:14px;border-radius:18px;gap:12px}
  .sheet-h h2{font-size:24px}
  .foot .btn{flex:1 1 100%}
  .chipb,.opt,.mini{min-height:44px}
  .step{font-size:13px;padding:5px 12px}
  .stages{gap:8px}
  .mm,.boot{padding:16px}
  .logo{width:160px;height:160px}
  .logo .play{width:90px}
}

/* pages */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.page[hidden]{display:none}
.pg-top{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 24px;background:var(--bar);border-bottom:3px solid var(--line)}
.pg-top h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:34px;line-height:1.1}
.back{min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);font-weight:800;font-size:15px;color:var(--ink)}
.pg-body{display:grid;grid-template-columns:340px minmax(0,1fr) 360px;gap:16px;padding:16px 24px;max-width:1640px;margin:0 auto}
.pg-body.biz{grid-template-columns:380px minmax(0,1fr) 360px}
.pg-foot{position:sticky;bottom:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 24px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bar);border-top:3px solid var(--line)}
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:10px;background:var(--deep);border:2px solid;border-radius:14px;padding:6px 18px}

function migrate(s){
  if(!s.eq)s.eq={};

  if(!s.incToday)s.incToday={ads:0,spons:0,mem:0,merch:0};
  if(!s.incHist)s.incHist=[];
  ['streak','maxLive','maxTotal'].forEach((k)=>{if(s[k]==null)s[k]=0});
  if(s.memOn==null)s.memOn=false;
  if(s.merchOn==null)s.merchOn=false;
  if(s.lastEvent===undefined)s.lastEvent=null;
  if(!s.skills)s.skills={};
  Object.keys(s.skills).forEach((k)=>{s.skills[k]=clamp(s.skills[k]|0,1,3)});
  if(!s.rivals||s.rivals.length<RIV0.length)s.rivals=RIV0.map((r)=>({n:r[0],s:r[1]}));
  if(s.video&&!s.video.team){const v=s.video;v.team=[];v.dur=v.dur||12;v.bbonus=v.bq||0;v.bold=50;v.prep=50;v.trim={}}

}

function toast(msg,kind){
  const box=$('#toasts');const d=document.createElement('div');
  d.className='toast'+(kind?' '+kind:'');d.textContent=msg;box.appendChild(d);
  while(box.children.length>3)box.removeChild(box.firstChild);

}

/* ---------- core mechanics ---------- */
function clampAll(){
  S.energy=clamp(S.energy,0,100);S.mood=clamp(S.mood,0,100);S.rep=clamp(S.rep,0,100);
  if(S.money<0)S.money=0;
}
function addXp(n){
  S.xp+=n;
  while(S.xp>=100*S.level){
    S.xp-=100*S.level;S.level++;S.sp++;S.energy=Math.min(100,S.energy+10);
    toast('ارتفع مستواك إلى '+S.level+'. حصلت على نقطة مهارة.','gold');
  }
}
function need(en){
  if(S.energy<en){toast('طاقتك لا تكفي ('+en+' مطلوبة). خذ استراحة أو أنهِ اليوم.','warn');return false}
  return true;
}
function spend(min,en){S.energy-=en;S.time+=min;}
function stepDone(){S.today.steps++;addXp(20)}
function moodF(){return 0.85+S.mood/100*0.3}

function maxBudget(){return clamp(Math.round((120+S.subs*0.1)/10)*10,100,2500)}
function capBudget(){return Math.max(0,Math.floor(Math.min(maxBudget(),S.money-GEN[ui.draft.genre].cost)/10)*10)}
function curBudget(){
  const c=capBudget();
  return ui.draft.budget==null?Math.min(c,Math.round(maxBudget()*0.3/10)*10):Math.min(ui.draft.budget,c);
}
function activeTeam(){return ui.draft.team.filter((id)=>{const m=TEAM.find((x)=>x.id===id);return m&&teamOk(m)})}
function startInfo(){
  const d=ui.draft,G=GEN[d.genre],B=curBudget();
  let t=0;activeTeam().forEach((id)=>{t+=TEAM.find((x)=>x.id===id).cost});
  return {cost:G.cost+B+t,en:5+Math.ceil(d.prep/12),tm:30+Math.round(d.prep*0.5),B:B};
}
const vTeam=(v,id)=>v.team.indexOf(id)>=0;
function shootInfo(v){
  const en=Math.max(5,20+GEN[v.genre].en+Math.floor(v.dur/8)-(vTeam(v,'karim')?4:0)+(vTeam(v,'sally')?6:0));
  return {en:en,tm:60+v.dur*6};
}
function editTime(v,n){return Math.max(30,60+v.dur*3-15*rk('quick')-S.eq.pc*8-(vTeam(v,'nour')?20:0))+n*10}
function fxMult(){return 1+0.34*rk('fx')}

function qScript(v){return clamp(Math.round((38+4*rk('write')+3*rk('story')+v.prep*0.08+rnd(0,22))*moodF()),10,100)}
function qImage(v){
  const e=S.eq;
  return (28+e.camera*5+e.light*3+e.set*2+e.drone*4+v.bbonus+v.prep*0.06+(vTeam(v,'karim')?6:0)+rk('color')*2+rnd(0,18))*moodF();
}
function qAudio(){const e=S.eq;return (28+e.mic*5+e.acoustic*4+rnd(0,22))*moodF()}
function calcEdit(v,ids,trim){
  const m=fxMult();let fe=0,fa=0;
  ids.forEach((id)=>{const f=FX[id];if(f.t==='a')fa+=f.q*m;else fe+=f.q*m});
  let tr=0;Object.keys(trim).forEach((k)=>{if(trim[k])tr+=TRIM[k]});
  const edit=clamp(Math.round((30+S.eq.pc*6+S.eq.soft*3+rk('color')*2+fe+tr+(vTeam(v,'nour')?8:0)+rnd(0,18))*moodF()),10,100);
  return {edit:edit,aud:Math.round(fa)};
}
function overall(v){
  const q=v.q;let o=q.script*0.3+q.img*0.2+q.aud*0.15+q.edit*0.35;
  if(v.dur>14&&q.script<55)o-=6;
  if(v.dur<6)o-=3;
  return clamp(Math.round(o),5,100);
}
function goldenText(){
  const m=S.time;
  if(m>=1080&&m<1320)return 'الساعة الذهبية الآن';
  if(m<1080){const d=1080-m;return 'الساعة الذهبية بعد '+Math.floor(d/60)+' س و'+(d%60)+' د'}
  return 'فاتت الساعة الذهبية';
}
function genTitles(v){
  const T=TITLES[v.genre]||TITLES.fun;
  const f=(x)=>x.replace('{t}',v.topic);
  return [
    {tag:'فضول',text:f(T[0]),ctr:1.2,ret:1,rep:0},
    {tag:'مباشر',text:f(T[1]),ctr:0.9,ret:1.12,rep:0},
    {tag:'مبالغ فيه',text:f(T[2]),ctr:1.45,ret:0.85,rep:-2}

function ctrPct(t,f){return 4.2*t.ctr*f.m*(1+S.eq.set*0.03+S.eq.neon*0.03)}
function projectViews(v,t,f,slot){
  const q=v.quality/100;
  const base=S.subs*0.45+320;
  return base*(0.5+q)*GEN[v.genre].reach*(0.7+v.heat/100)*t.ctr*f.m*slot.m*(1+0.04*rk('viral'))*(0.8+S.rep/250)
    *(1+S.eq.set*0.03+S.eq.neon*0.03)*(DIFF[CFG.diff]||1)*(0.8+v.bold/100*0.4)*(vTeam(v,'sally')?1.15:1);
}
function convRate(v){
  return (0.006+v.quality/100*0.014)*(v.genre==='edu'?1.15:1)*(1+0.05*rk('community'))*(v.ret||1)*(0.9+S.rep/500);
}
function applyViews(v,views){
  const dm=(0.7+(v.dur||12)/20)/1.3;
  const m=views*0.025*(0.8+S.rep/250)*dm;
  S.views+=views;S.dayViews+=views;
  S.subs+=views*convRate(v);
  S.money+=m;S.incToday.ads+=m;
}

function checks(){
  clampAll();
  S.tasks.forEach((t)=>{
    if(!t.done&&S.today[t.key]>=t.need){
      t.done=true;const r=Math.round(t.reward*(1+S.subs/3000));S.money+=r;addXp(20);
      toast('أنجزت مهمة: '+t.t+' (+'+fmt(r)+')','gold');
    }
  });
  while(S.goals<GOALS.length&&Math.floor(S.subs)>=GOALS[S.goals].n){
    const g=GOALS[S.goals];S.money+=g.reward;S.goals++;
    toast('وصلت إلى '+g.name+'. مكافأة +'+fmt(g.reward),'gold');
    if(g.n===100000&&!S.won){S.won=true;S.pendingWin=true}
  }
  ACH.forEach((a)=>{if(!S.ach[a.id]&&a.t()){S.ach[a.id]=1;toast('إنجاز جديد: '+a.n,'gold')}});
}
function after(){
  if(S.time>=1440){endDay(true);return}
  checks();save();renderAll();
}
function endDay(forced){
  S.published.forEach((v)=>{
    if(v.pending>0){const p=v.pending;v.pending=0;v.views+=p;applyViews(v,p)}
    if(v.remaining>0){
      const r=v.remaining>40?Math.round(v.remaining*0.5):v.remaining;
      v.remaining-=r;v.views+=r;applyViews(v,r);
    }
  });
  if(S.memOn){const m=Math.floor(S.subs*0.0008*(0.5+S.rep/100))*4;S.money+=m;S.incToday.mem+=m}
  if(S.merchOn){const m=Math.round(S.subs*0.0004*(0.5+S.rep/100)*20);S.money+=m;S.incToday.merch+=m}
  S.incHist.push(S.incToday);if(S.incHist.length>30)S.incHist.shift();
  S.incToday={ads:0,spons:0,mem:0,merch:0};
  S.streak=S.today.pub>0?S.streak+1:0;
  S.hist.push(Math.round(S.dayViews));if(S.hist.length>14)S.hist.shift();
  const dv=S.dayViews;S.dayViews=0;
  S.rivals.forEach((r)=>{r.s*=1+rnd(0.004,0.02)});
  S.day++;S.time=540;
  S.energy=clamp(S.energy+(forced?45:70),0,100);
  S.mood=clamp(Math.round(S.mood+(72-S.mood)*0.35),0,100);
  if(S.sponsor){S.sponsor.days--;if(S.sponsor.days<=0){S.sponsor=null;toast('انتهى عرض الراعي.')}}
  if(!S.sponsor&&S.day>=3&&Math.random()<0.35)S.sponsor=genSponsor();
  S.heat=genHeat();S.comments=genComments(3);S.tasks=genTasks();
  S.today={steps:0,replies:0,live:0,pub:0};
  checks();
  S.snap={money:S.money,subs:S.subs,views:S.views};
  if(S.day>=3&&Math.random()<0.22)S.event=ri(0,EVENTS.length-1);
  toast('اليوم '+S.day+' بدأ. مشاهدات أمس: '+fmt(dv),'gold');
  save();renderAll();
}
function commentEffect(c,primary){
  if(c.type==='love'){
    if(primary){S.mood+=3+rk('warm');S.subs+=ri(1,3)+rk('warm');addXp(4);S.today.replies++}
    else{S.subs+=1;S.mood+=1}
  }else if(c.type==='critic'){
    if(primary){S.rep+=1+(has('critics')?1:0);S.mood+=1;addXp(4);S.today.replies++}
    else{if(!has('critics'))S.mood-=2}
  }else{S.rep+=1;if(!primary)addXp(2)}
}

    const late=slot.h*60<S.time;
    let first=T*0.35,pending=0;if(late){pending=first;first=0}
    const rec={title:t.text,quality:v.quality,ctr:ctrPct(t,f),total:T,remaining:T*0.65,pending:pending,views:first,day:S.day,ret:t.ret,genre:v.genre,dur:v.dur,slot:slot.n};
    const subs0=S.subs;
    S.published.unshift(rec);if(S.published.length>30)S.published.pop();

    S.rep+=t.rep-Math.round(Math.max(0,(v.bold-60)/15));

document.addEventListener('input',(e)=>{
  const el=e.target;if(!el||!el.dataset||!el.dataset.slider||S.video)return;
  const k=el.dataset.slider,val=+el.value;
  ui.draft[k]=val;
  const min=+el.min,max=+el.max;
  el.style.setProperty('--p',(max>min?(val-min)/(max-min)*100:0)+'%');
  const sv=document.getElementById('sv-'+k);
  if(sv)sv.textContent=k==='budget'?fmt(val):k==='dur'?val+' دقيقة':k==='bold'?boldLabel(val):val+'%';
  updateStartMeta();
});

/* ---------- boot ---------- */
document.addEventListener('click',(e)=>{
  const ov=$('#overlay');
  if(e.target===ov&&!ui.block){closeModal();return}
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const fn=acts[b.dataset.act];
  if(fn)fn(b.dataset.arg,b);
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(ui.modal&&!ui.block)closeModal();
    else if(!ui.modal&&ui.page&&!ui.menu)closePage();
  }
  if(e.key==='Enter'&&e.target&&e.target.id==='chName'){acts.start()}
});

loadCfg();applyCfg();
const saved=load();
S=saved||newState();
if(!S.heat||!S.tasks)freshWorld();
ui.menu=true;renderAll();

/* ---------- loading screen ---------- */
(function bootScreen(){
  const boot=$('#boot'),app=$('#app'),ov=$('#overlay');
  if(!boot)return;
  app.inert=true;ov.inert=true;
  const tips=['الساعة الذهبية بين 6 و10 مساءً ترفع المشاهدات','العنوان المبالغ فيه ينفع، لكنه يضر سمعتك','اضبط الميزانية والتحضير قبل أن تبدأ الفيديو','استرح قبل أن تنفد طاقتك','ردّ على المحبين، وتجاهل السبام','اختر موضوعًا ساخنًا يناسب نوع فيديوك'];
  const tip=$('#bootTip'),fill=$('#bootFill'),subs=$('#bootSubs'),go=$('#bootGo');
  let ti=0,p=0,fontsOk=false,loaded=document.readyState==='complete';const t0=Date.now();
  window.addEventListener('load',()=>{loaded=true});
  tip.textContent=tips[0];
  const tipTimer=setInterval(()=>{ti=(ti+1)%tips.length;tip.textContent=tips[ti]},1500);
  const fr=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  Promise.race([fr,new Promise((r)=>setTimeout(r,2500))]).then(()=>{fontsOk=true});
  const iv=setInterval(()=>{
    let target=Math.min(100,(Date.now()-t0)/8000*100);
    if(!(fontsOk&&loaded))target=Math.min(target,92);
    p=Math.max(p,target);
    fill.style.width=p+'%';
    subs.textContent=fmt(Math.round(100000*Math.pow(p/100,2)));
    if(p>=100){
      clearInterval(iv);clearInterval(tipTimer);
      tip.textContent='الاستوديو جاهز. الكاميرا تعمل.';
      go.hidden=false;go.focus();
    }
  },40);
  function finish(){
    ov.inert=false;
    boot.classList.add('out');
    setTimeout(()=>{if(boot.parentNode)boot.parentNode.removeChild(boot)},420);
    showMenu();
  }
  go.addEventListener('click',finish);
})();
})();
</script>
