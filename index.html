<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14103A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حلم الشهرة">
<meta name="description" content="حلم الشهرة: لعبة إدارة صانع محتوى بالعربية">
<title>حلم الشهرة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  box-sizing:border-box;
  --bg:#14103A;--bar:#1C1550;--panel:#231B5A;--panel2:#2A2070;--line:#3A2F96;--line2:#4B3FA8;
  --deep:#0E0A2B;--ink:#F4F1FF;--muted:#C9C1F5;--dim:#8D83DB;
  --red:#FF4D5E;--gold:#FFC93C;--teal:#35E0C0;--blue:#5AB0FF;--pink:#FF7AC6;--violet:#B9A8FF;
  --colw:480px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14103A}}
:root[data-theme="dark"]{--bg:#14103A}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#080620;color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{text-decoration:none}
svg{display:block}
.disp{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-inline-start:auto}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* ---------- column shell ---------- */
#app,.page,.map{position:fixed;top:0;bottom:0;left:0;right:0;max-width:var(--colw);margin:0 auto;background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#app{display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line),0 0 80px rgba(0,0,0,.7)}

/* HUD */
.top{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 12px 7px;background:var(--bar);border-bottom:3px solid var(--line)}
.top-a{display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--red);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--bg);flex:none;overflow:hidden}
.who-t{min-width:0;display:flex;flex-direction:column}
.who-name{font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.lvl b{background:var(--gold);color:var(--bg);padding:0 9px;border-radius:999px;font-weight:800;font-size:11px}
.lvl .xpb{flex:1;max-width:90px;height:6px}
.sq{width:40px;height:40px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.sq svg{width:20px;height:20px}
.top-b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--line2);border-radius:12px;padding:3px 8px;min-width:0}
.stat svg{width:17px;height:17px;flex:none}
.stat .sv{font-family:'Lalezar',sans-serif;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:none}
.top-c{display:flex;align-items:center;gap:8px}
.meter{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.meter svg{width:16px;height:16px;flex:none}
.meter b{width:24px;text-align:end;font-size:12px}
.bar-t{flex:1;height:10px;border-radius:999px;background:var(--deep);overflow:hidden;min-width:20px}
.bar-t i{display:block;height:100%}
.clock{display:flex;align-items:center;gap:6px;background:var(--deep);border:2px solid var(--gold);border-radius:12px;padding:1px 10px;flex:none}
.clock small{font-size:11px;color:var(--muted)}
.clock b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:17px;color:var(--gold);line-height:1.2}

/* stage (3D studio) */
.stage{position:relative;flex:1;min-height:150px;margin:8px 10px 0;border:3px solid var(--line);border-radius:20px;overflow:hidden;background:#1B1547}
#stCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stfb{position:absolute;inset:0;background:linear-gradient(#2A2166 73.3%,#1E1750 73.3%);display:flex;align-items:center;justify-content:center}
.stfb[hidden]{display:none}
.stfb .scene-in{position:relative;width:100%;max-height:100%;aspect-ratio:730/450}
.stfb .scene-in svg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-50%);min-height:36px;padding:2px 12px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800;font-size:13px;border:2px solid var(--gold);white-space:nowrap}
.slabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.slabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;min-height:36px;padding:2px 12px 2px 10px;border-radius:999px;border:2px solid var(--gold);background:rgba(20,16,58,.92);color:var(--ink);font-weight:800;font-size:13px;white-space:nowrap;will-change:transform}
.slabel svg{width:16px;height:16px}
.stchips{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.chip-s{background:rgba(20,16,58,.88);border:2px solid;border-radius:999px;font-weight:800;font-size:12px;padding:1px 10px}

/* dock */
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 10px calc(8px + var(--sb))}
.pipe-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px;min-height:46px;width:100%;text-align:start}
.pipe-t{display:flex;flex-direction:column;min-width:0;flex:1}
.pipe-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-t span{font-size:11px;color:var(--muted)}
.pdots{display:flex;gap:4px;flex:none}
.pdots i{width:22px;height:8px;border-radius:999px;background:var(--deep)}
.pdots i.done{background:var(--teal)}
.pdots i.cur{background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;min-height:62px;border-radius:14px;border:2px solid;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.tile svg{width:24px;height:24px}
.tile b{font-size:13px;font-weight:800;line-height:1.2}
.tile small{font-size:10px;line-height:1.2;white-space:nowrap}
.tile.main{background:var(--red);color:var(--bg);box-shadow:0 4px 0 #9E2230}
.badge{position:absolute;top:-7px;inset-inline-end:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:var(--bg);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.endday{min-height:48px;border-radius:14px;border:3px solid var(--bg);background:var(--gold);color:var(--bg);font-family:'Lalezar',sans-serif;font-size:22px;box-shadow:0 4px 0 #B9822A;display:flex;align-items:center;justify-content:center;gap:10px}
.endday svg{width:22px;height:22px}
@media (max-height:700px){
  .tile{min-height:52px}.tile small{display:none}.endday{min-height:42px;font-size:19px}.pipe-row{min-height:40px;padding:4px 10px}
  .top{padding:6px 12px 5px;gap:4px}.stage{min-height:120px;margin-top:6px}
}

/* generic panels */
.panel{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:21px}
.task{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:8px 12px}
.task .tb{min-width:44px;height:28px;border-radius:8px;border:3px solid var(--dim);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;padding:0 4px}
.task.done .tb{background:var(--teal);border-color:var(--teal);color:var(--bg);font-size:16px}
.task .tt{flex:1;font-size:15px;font-weight:700}
.task .tr{font-size:13px;font-weight:800;color:var(--gold)}
.met{display:flex;flex-direction:column;gap:4px}
.met .mh{display:flex;justify-content:space-between;font-size:14px}
.tag{background:var(--panel2);border:2px solid var(--line2);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.trend .th{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.trend .th span:last-child{font-size:12px;font-weight:800;white-space:nowrap}
.cm{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.cm .ch{display:flex;align-items:center;gap:8px}
.cm .ch b{font-size:13px}
.cm .tg{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;color:var(--bg)}
.cm p{font-size:14px;line-height:1.5}
.cm .ca{display:flex;gap:8px}
.mini{min-height:40px;padding:4px 16px;border-radius:999px;border:2px solid var(--teal);background:transparent;color:var(--teal);font-weight:800;font-size:13px}
.mini.alt{border-color:var(--line2);color:var(--muted);font-weight:700}
.spons{background:var(--gold);color:var(--bg);border:3px solid var(--bg);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 #B9822A}
.spons h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:21px}
.spons .sb{display:flex;gap:8px}
.spons button{flex:1;min-height:44px;border-radius:12px;border:3px solid var(--bg);background:transparent;color:var(--bg);font-weight:800;font-size:15px}
.spons button.main{background:var(--bg);color:var(--gold)}
.empty{border:3px dashed var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* bottom sheets */
.overlay{position:fixed;inset:0;z-index:58;background:rgba(8,6,32,.82);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:var(--colw);max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:3px solid var(--line2);border-bottom:none;border-radius:26px 26px 0 0;
  padding:12px 14px calc(14px + var(--sb));display:flex;flex-direction:column;gap:12px}
.sheet::before{content:'';align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line2);flex:none;margin-bottom:-2px}
.sheet:focus{outline:none}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:26px}
.sheet-h .x{margin-inline-start:auto;min-height:42px;min-width:42px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);font-weight:800;padding:0 14px}
.cols{display:flex;flex-direction:column;gap:12px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{padding:5px 14px;border-radius:999px;font-weight:800;font-size:13px;border:3px solid var(--line2);background:var(--bar);color:var(--muted)}
.step.done{background:#1E3A5E;border-color:var(--teal);color:var(--teal)}
.step.cur{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.chipb{min-height:44px;padding:4px 16px;border-radius:999px;font-weight:800;font-size:15px;border:3px solid var(--line2);background:var(--panel2)}
.chipb[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.chipb.sm{min-height:40px;padding:2px 14px;font-size:14px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:start;min-height:46px;padding:8px 14px;border-radius:14px;border:3px solid var(--line2);background:var(--panel2);width:100%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#1E3A5E}
.opt b{font-size:15px}
.opt span{font-size:12px;color:var(--muted)}
.btn{min-height:52px;padding:6px 22px;border-radius:14px;border:3px solid var(--bg);background:var(--gold);color:var(--bg);font-family:'Lalezar',sans-serif;font-size:22px;box-shadow:0 5px 0 #B9822A}
.btn.red{background:var(--red);box-shadow:0 5px 0 #9E2230}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2);box-shadow:none;font-family:'Tajawal',sans-serif;font-weight:800;font-size:15px}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 #1D9C86}
.btn.block{width:100%}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gear{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:3px solid var(--line2);border-radius:16px;padding:12px}
.gear.max{border-color:var(--teal)}
.gear.deal{border-color:var(--gold)}
.gi{width:40px;height:40px;border-radius:12px;color:var(--bg);font-family:'Lalezar',sans-serif;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:8px;border-radius:999px;background:var(--deep)}
.pips i.on{background:var(--gold)}
.dealtag{background:var(--gold);color:var(--bg);font-weight:800;font-size:12px;padding:1px 10px;border-radius:999px;align-self:flex-start}
.strike{text-decoration:line-through;color:var(--muted);font-weight:500;margin-inline-end:6px}
.keeper{display:flex;align-items:center;gap:12px;background:var(--panel2);border:2px solid var(--line2);border-radius:16px;padding:8px 14px}
.keeper .ti{width:44px;height:44px;border-radius:50%;color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Lalezar',sans-serif;font-size:24px;flex:none}
.keeper div{display:flex;flex-direction:column;min-width:0}
.sk{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:3px solid;border-radius:16px;padding:12px}
.node{display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:start;padding:8px 10px;border-radius:10px;border:2px solid var(--line2);background:var(--bar)}
.node.on{background:#1E3A5E;border-color:var(--teal)}
.node.open{background:#3A3470;border-color:var(--gold)}
.node .nr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.node .ns{font-size:12px;font-weight:800}
.node .nd{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;padding-bottom:6px;border-bottom:3px solid var(--line)}
.chart i{flex:1;border-radius:6px 6px 0 0;background:var(--blue);min-height:6px}
.rv{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:var(--panel2)}
.rv.me{background:var(--gold);color:var(--bg)}
.rv b:first-child{width:28px;font-family:'Lalezar',sans-serif;font-weight:400;font-size:20px}
.ach{display:flex;align-items:center;gap:10px}
.ach i{width:38px;height:38px;border-radius:10px;border:2px solid var(--line2);background:var(--deep);color:var(--dim);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;flex:none}
.ach.on i{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.ev{background:var(--red);color:var(--bg);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tmr{background:var(--bg);color:var(--red);font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;white-space:nowrap}
.evr{display:flex;flex-direction:column;background:rgba(14,10,43,.18);border-radius:10px;padding:8px 10px;font-size:14px}
input.txt{min-height:50px;width:100%;border-radius:12px;border:3px solid var(--line2);background:var(--deep);padding:6px 14px;font-size:16px}
label.lb{font-weight:800;font-size:14px}
.toasts{position:fixed;z-index:70;inset-inline:0;top:calc(132px + var(--st));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--bg);border:3px solid var(--teal);border-radius:14px;padding:8px 16px;font-weight:700;font-size:14px;max-width:min(94vw,440px);box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center}
.toast.warn{border-color:var(--red)}
.toast.gold{border-color:var(--gold)}

/* ---------- pages ---------- */
.page{z-index:30;display:flex;flex-direction:column}
.page[hidden]{display:none}
.pg-top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar);border-bottom:3px solid var(--line)}
.pg-top h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:24px;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:42px;height:42px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);padding:0;flex:none}
.back svg{width:20px;height:20px}
.pg-tabs{flex:none;display:flex;gap:6px;padding:8px 12px;background:var(--bar);border-bottom:2px solid var(--line)}
.pg-tab{flex:1;min-height:40px;padding:2px 6px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);font-weight:800;font-size:14px;white-space:nowrap}
.pg-tab[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.pg-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px}
.pg-body>.col{display:none;flex-direction:column;gap:12px}
.pg-body[data-tab="1"]>.col:nth-child(1),.pg-body[data-tab="2"]>.col:nth-child(2),.pg-body[data-tab="3"]>.col:nth-child(3){display:flex}
.pg-foot{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 12px calc(10px + var(--sb));background:var(--bar);border-top:3px solid var(--line)}
.foot-row{display:flex;align-items:center;gap:8px}
.foot-row .btn{flex:1}
.foot-row .btn.ghost{flex:none;min-height:52px;padding:4px 12px;font-size:13px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 .tag{font-size:11px;padding:0 9px}
.pill{display:flex;align-items:center;gap:6px;background:var(--deep);border:2px solid;border-radius:12px;padding:2px 12px}
.pill b{font-size:19px;line-height:1.2;font-weight:400}
.pill .small{display:none}
.pill.gold{border-color:var(--gold)}.pill.gold b{color:var(--gold)}
.pill.blue{border-color:var(--blue)}.pill.blue b{color:var(--blue)}
.sh{font-family:'Lalezar',sans-serif;font-weight:400;font-size:18px;margin:4px 0 0}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.topics .opt{padding:6px 10px}
.topics .opt b{font-size:13px}
.sls{display:flex;flex-direction:column;gap:12px}
.sl{display:flex;flex-direction:column;gap:2px;font-size:14px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;background:linear-gradient(to left,var(--c) var(--p),var(--deep) var(--p));margin:10px 0;outline-offset:8px;touch-action:pan-y}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);border:5px solid var(--c);cursor:pointer}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:5px solid var(--c);cursor:pointer}
.rng::-moz-range-track{background:transparent}
.rng:disabled{opacity:.6}
.team{display:flex;align-items:center;gap:10px;width:100%;text-align:start;min-height:56px;background:var(--panel2);border:3px solid var(--line2);border-radius:12px;padding:6px 12px}
.team[aria-pressed="true"],.team.on{border-color:var(--teal);background:#1E3A5E}
.team.off{opacity:.55}
.team .ti{width:36px;height:36px;border-radius:50%;color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Lalezar',sans-serif;font-size:20px;flex:none}
.team .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.team .tx b{font-size:14px}
.team .tx span{font-size:12px;color:var(--muted)}
.team .tc{font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
.prev-grid{display:flex;flex-direction:column;gap:12px}
.prev{position:relative;border-radius:14px;border:3px solid var(--blue);overflow:hidden;background:var(--deep);aspect-ratio:640/250}
.prev svg{position:absolute;inset:0;width:100%;height:100%}
.prev-tag{position:absolute;top:10px;inset-inline-end:12px;background:var(--red);color:var(--bg);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.prev-time{position:absolute;bottom:10px;inset-inline-start:12px;background:var(--bg);border:2px solid var(--blue);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.qual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.qual h2{grid-column:1/-1}
.ruler{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-inline-start:58px}
.tl-row{display:flex;align-items:center;gap:8px}
.tl-n{width:50px;font-weight:800;font-size:12px;flex:none}
.tl-lane{position:relative;flex:1;height:40px;border-radius:10px;background:var(--deep)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:8px;color:var(--bg);font-size:11px;font-weight:800;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;border:0;font-family:inherit}
.clip.cut{outline:2px dashed var(--bg);outline-offset:-4px;opacity:.85}
.fxs{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.fxb{min-height:44px;padding:4px 14px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);font-weight:700;font-size:13px}
.fxb[aria-pressed="true"]{border-color:var(--teal);background:#1E3A5E}
.fxb b{color:var(--gold);font-weight:800;margin-inline-start:4px}
.thumb{position:relative;height:150px;border-radius:14px;background:var(--gold);border:3px solid var(--bg);overflow:hidden}
.th-t{position:absolute;inset-inline-start:14px;top:14px;width:56%;font-family:'Lalezar',sans-serif;font-size:28px;line-height:1.1;color:var(--bg);overflow:hidden;max-height:120px}
.th-svg{position:absolute;inset-inline-end:10px;bottom:0}
.ttl{position:relative;padding-inline-end:60px}
.ttl em{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:13px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{min-height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--line2);background:var(--panel2)}
.slot[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--bg)}
.slot b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:19px}
.slot span{font-size:11px}
.inc-bar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--deep)}
.dot{width:14px;height:14px;border-radius:4px;flex:none}
.iv{font-weight:800;width:64px;text-align:end}
.unl{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--panel2);border-radius:12px;padding:6px 10px;flex-wrap:wrap}
.aud{background:var(--panel2);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.aud b{font-size:16px}

/* ---------- map ---------- */
.map{z-index:31;background:#14103A;overflow:hidden;padding:0}
.map[hidden]{display:none}
#mapCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.plabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.plabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;padding:4px 12px;border-radius:14px;border:3px solid var(--gold);background:rgba(20,16,58,.92);color:var(--ink);font-weight:800;font-size:13px;line-height:1.2;white-space:nowrap;will-change:transform}
.plabel small{font-size:11px;font-weight:800}
.plabel.closed{border-color:var(--red)}
.plabel.locked{border-color:var(--dim);color:var(--muted)}
.map-hud{position:absolute;inset-inline:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--st)) 12px 8px;pointer-events:none}
.map-hud>*{pointer-events:auto}
.map-title{display:flex;flex-direction:column;background:rgba(28,21,80,.92);border:2px solid var(--line2);border-radius:14px;padding:2px 12px;line-height:1.3;min-width:0}
.map-title b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:18px}
.map-title span{font-size:11px;color:var(--muted)}
.pbar{position:absolute;inset-inline:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:8px 12px calc(10px + var(--sb));background:linear-gradient(transparent,rgba(8,6,32,.85) 40%)}
.pbar button{flex:none;min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid var(--gold);background:rgba(28,21,80,.95);font-weight:800;font-size:13px}
.pbar button.closed{border-color:var(--red)}
.pbar button.locked{border-color:var(--dim);color:var(--muted)}
.map-zoom{position:absolute;inset-inline-end:12px;top:calc(64px + var(--st));display:flex;flex-direction:column;gap:8px}
.map-zoom button{width:42px;height:42px;border-radius:12px;border:2px solid var(--line2);background:rgba(28,21,80,.92);font-weight:800;font-size:22px;padding:0}
.map-hint{position:absolute;inset-inline:0;bottom:calc(68px + var(--sb));margin:0 auto;width:fit-content;max-width:90%;background:rgba(28,21,80,.9);border:2px solid var(--line2);border-radius:999px;padding:3px 14px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;pointer-events:none}
.map-fb{position:absolute;inset:0;overflow-y:auto;padding:calc(64px + var(--st)) 14px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.map-fb[hidden]{display:none}

/* ---------- boot / menu / rotate ---------- */
.boot,.mm{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.boot{z-index:60}
.mm{z-index:55}
.mm[hidden]{display:none}
.boot.out{opacity:0;transition:opacity .4s}
.boot-in,.mm-in{position:relative;z-index:2;width:100%;max-width:420px;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rec{position:absolute;top:-70px;inset-inline-end:24px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:1px;color:var(--red)}
.rec i{width:12px;height:12px;border-radius:50%;background:var(--red)}
.logo{position:relative;width:min(78vw,320px);aspect-ratio:520/453;display:flex;align-items:center;justify-content:center}
.logo .ring{position:absolute;left:50%;top:50%;width:112%;aspect-ratio:1;transform:translate(-50%,-50%)}
.logo-img{position:relative;display:block;width:100%;height:auto;object-fit:contain}
.bl{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.bl-bar{position:relative;height:18px;border-radius:999px;background:var(--deep);border:3px solid var(--line2)}
.bl-bar i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:999px;background:var(--red)}
.bl-bar i::after{content:'';position:absolute;inset-inline-end:-3px;top:-8px;bottom:-8px;width:6px;border-radius:3px;background:var(--gold)}
.bl-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);min-height:36px;align-items:flex-start}
.bl-subs{white-space:nowrap}
.bl-subs b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:21px;color:var(--gold)}
.credit{font-size:13px;color:var(--muted);line-height:1.7}
.credit bdi{color:var(--gold);font-weight:800;font-size:15px}
.rise{position:absolute;z-index:1;bottom:-60px;padding:4px 14px;border-radius:999px;border:2px solid var(--line2);background:var(--panel2);font-weight:800;font-size:14px;color:var(--muted);opacity:0}
.mm-logo{width:min(78vw,320px);aspect-ratio:520/453}
.mm-btns{display:flex;flex-direction:column;gap:12px;width:100%}
.mm-btns .btn{width:100%}
.mm-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px}
.rotate{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.rotate .phone{width:104px;height:64px;border:6px solid var(--gold);border-radius:14px;position:relative}
.rotate .phone::after{content:'';position:absolute;top:50%;inset-inline-start:6px;width:4px;height:16px;border-radius:2px;background:var(--gold);transform:translateY(-50%)}
.rotate b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:30px}
@media (orientation:landscape) and (pointer:coarse) and (max-height:620px){.rotate{display:flex}}

/* motion */
@media (prefers-reduced-motion:no-preference){
  .rec i{animation:blink 1s steps(2,jump-none) infinite}
  .logo .ring{animation:spin 9s linear infinite}
  .logo-img{animation:beat 2.4s ease-in-out infinite}
  .rise{animation:rise 7s linear infinite}
  .toast{animation:pop .18s ease-out}
  .sheet{animation:up .22s ease-out}
  .rotate .phone{animation:turn 2.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.15}}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes beat{50%{transform:scale(1.04)}}
  @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.5}85%{opacity:.5}100%{transform:translateY(-110vh);opacity:0}}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
}
@media (prefers-reduced-motion:reduce){.rise{opacity:.35;bottom:auto}}
body.large{zoom:1.1}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation:none!important;transition:none!important}
body.nomotion .rise{opacity:.3;bottom:auto}
@media (max-width:360px){
  .stat .sv{font-size:15px}.tile b{font-size:12px}.who-name{font-size:17px}.pg-tab{font-size:13px}
}

/* ---------- Sos System (phone + computer) ---------- */
.os{flex:1;min-height:0;display:flex;flex-direction:column;background:#0E0A2B;color:var(--ink)}
.os-bar{flex:none;display:flex;align-items:center;gap:10px;padding:5px 14px;background:#0A0720;font-size:12px;font-weight:700}
.os-name{font-family:'Lalezar',sans-serif;font-size:15px;color:var(--gold)}
.os-sp{flex:1}
.os-ic{display:flex;align-items:center;gap:4px}
.os-ic svg{width:16px;height:16px}
.os-time{font-weight:800}
.os-desk{position:relative;flex:1;min-height:0;overflow:hidden;padding:16px 14px;display:flex;flex-direction:column;gap:18px;background:#1B1547}
.os-desk::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:#231B5A;top:-120px;inset-inline-end:-120px}
.os-desk::after{content:'';position:absolute;width:240px;height:240px;border-radius:44px;background:#2A2070;bottom:-90px;inset-inline-start:-70px;transform:rotate(18deg)}
.os.phone .os-desk::after{border-radius:50%}
.os-desk>*{position:relative;z-index:1}
.os-boot{position:absolute!important;inset:0;z-index:5!important;background:#0A0720;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;pointer-events:none;animation:osboot 1.3s ease-out forwards}
.os-boot b{font-size:72px;color:var(--gold);line-height:1}
.os-boot span{letter-spacing:8px;color:var(--muted);font-size:14px;font-weight:700}
@keyframes osboot{0%,60%{opacity:1}100%{opacity:0;visibility:hidden}}
.os-widget{background:rgba(28,21,80,.94);border:2px solid var(--line2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.os-widget b{font-size:16px}
.os-widget span{font-size:13px;color:var(--muted)}
.os-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px;margin-top:auto;margin-bottom:auto}
.os-app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px;color:var(--ink)}
.os-ico{width:72px;height:72px;border-radius:22px;color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.os-ico svg{width:36px;height:36px}
.os-ico.sm{width:30px;height:30px;border-radius:9px;box-shadow:none}
.os-ico.sm svg{width:18px;height:18px}
.os.pc .os-ico{border-radius:16px}
.os-app b{font-size:15px}
.os-app.next .os-ico{outline:3px solid var(--gold);outline-offset:4px}
.os-app small{background:var(--gold);color:var(--bg);font-weight:800;border-radius:999px;padding:0 10px;font-size:11px;margin-top:-2px}
.os-task{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px calc(6px + var(--sb));background:#0A0720;border-top:2px solid var(--line)}
.os-start{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:2px solid var(--gold);background:var(--bg);font-family:'Lalezar',sans-serif;font-size:16px;color:var(--gold)}
.os-start svg{width:18px;height:18px}
.os-tab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--panel2);border-radius:8px;padding:6px 10px}
.os-tab svg{width:16px;height:16px}
.os-pw{width:38px;height:38px;border-radius:10px;border:2px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.os-pw svg{width:18px;height:18px}
.os-nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 18px calc(8px + var(--sb));background:#0A0720}
.os-nav button.nv{width:38px;height:38px;border-radius:50%;border:2px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.os-nav button.nv svg{width:18px;height:18px}
.os-nav .pill-h{width:120px;height:7px;border-radius:4px;background:var(--muted);border:0;padding:0}
.os-nav i{width:38px}
.os-win{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.os-title{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--bar);border-bottom:2px solid var(--line)}
.os-title b{flex:1;font-family:'Lalezar',sans-serif;font-weight:400;font-size:19px}
.os-x{width:36px;height:36px;border-radius:10px;border:2px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.os-x svg{width:16px;height:16px}
.pg-body.sos{flex:1;min-height:0}
.pg-body[data-tab="4"]>.col:nth-child(4){display:flex}
.camcard{display:flex;align-items:center;gap:12px}
.camcard .os-ico{flex:none}
.how{display:flex;align-items:center;gap:10px;font-size:14px}
.how i{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;flex:none}
.how i svg{width:18px;height:18px}
.asst{display:flex;flex-direction:column;gap:3px;font-size:13px}

/* ---------- camera mini-game ---------- */
.cam{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:45;background:#000;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.cam[hidden]{display:none}
.cam-view{position:relative;flex:1;min-height:0;overflow:hidden;background:#1B1547;touch-action:none}
.cam-scene{position:absolute;inset:0;transform-origin:50% 55%;transition:transform .55s ease}
.cam-scene svg{width:100%;height:100%;display:block}
.cam-dark{position:absolute;inset:0;background:#05031A;opacity:0;transition:opacity .35s;pointer-events:none}
.cam-grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%),
  linear-gradient(transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%)}
.cam-corner{position:absolute;width:28px;height:28px;border:3px solid rgba(255,255,255,.85);pointer-events:none}
.cam-corner.a{top:62px;inset-inline-start:14px;border-right:0;border-bottom:0}
.cam-corner.b{top:62px;inset-inline-end:14px;border-left:0;border-bottom:0}
.cam-corner.c{bottom:14px;inset-inline-start:14px;border-right:0;border-top:0}
.cam-corner.d{bottom:14px;inset-inline-end:14px;border-left:0;border-top:0}
.cam-top{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;font-weight:800;font-size:14px;pointer-events:none}
.cam-top .recd{width:12px;height:12px;border-radius:50%;background:var(--red)}
.cam-top .sp2{flex:1}
.cam-exit{pointer-events:auto;min-height:36px;padding:0 14px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:13px}
.cam-prompt{position:absolute;top:30%;inset-inline:0;text-align:center;pointer-events:none}
.cam-prompt span{display:inline-block;background:rgba(0,0,0,.65);border:2px solid var(--gold);color:var(--gold);font-weight:800;font-size:20px;padding:4px 18px;border-radius:999px}
.cam-ring{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:4px solid var(--teal);pointer-events:none}
.cam-ring::before{content:'';position:absolute;inset:34px;border-radius:50%;border:3px solid #fff}
.cam-ring::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--gold);animation:ringshrink var(--w,1.6s) linear forwards}
@keyframes ringshrink{from{transform:scale(1.7);opacity:.2}to{transform:scale(1);opacity:1}}
.cam-fb{position:absolute;pointer-events:none;font-weight:800;font-size:22px;text-shadow:0 2px 0 #000;animation:fbup .9s ease-out forwards;white-space:nowrap}
.cam-fb.ok{color:var(--teal)}
.cam-fb.no{color:var(--red)}
@keyframes fbup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
.cam-ctrl{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px calc(12px + var(--sb));background:#0A0720}
.cam-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;border-radius:18px;border:3px solid var(--line2);background:var(--panel);font-weight:800;font-size:12px}
.cam-btn svg{width:26px;height:26px}
.cam-btn.pulse{border-color:var(--gold);background:#3A3470;animation:pulse .5s ease-in-out infinite alternate}
.cam-btn.shake{animation:shake .25s}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cam-prog{flex:none;display:flex;gap:4px;padding:8px 14px 0;background:#0A0720}
.cam-prog i{flex:1;height:8px;border-radius:4px;background:var(--panel2)}
.cam-prog i.ok{background:var(--teal)}
.cam-prog i.no{background:var(--red)}
.cam-prog i.cur{background:var(--gold)}
.talk{transform-origin:200px 285px;animation:talk .42s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(1.2)}}
.blink{transform-origin:center;animation:blink2 3.2s infinite}
@keyframes blink2{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bob{animation:bob 2.6s ease-in-out infinite alternate}

.tour-info{display:flex;flex-direction:column;flex:1}
.tour-info b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:22px;color:var(--gold)}
.tour-info span{font-size:12px;color:var(--muted)}

/* ---------- cafe ---------- */
.cafe{position:fixed;top:0;bottom:0;left:0;right:0;z-index:34;background:#2A1608;overflow:hidden}
.cafe[hidden]{display:none}
#cafeCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.clabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.clabels .slabel{pointer-events:auto}
.cb{position:absolute;left:0;top:0;background:#fff;color:#14103A;font-weight:800;font-size:12px;border-radius:12px;padding:3px 10px;white-space:nowrap;border:2px solid #14103A;will-change:transform}
.cb.off{opacity:0}
.cb.ask{background:var(--gold)}
.cb.wait{background:#E9E4FF}
.cb.ok{background:var(--teal)}
.cafe .map-hud{pointer-events:none}
.cafe-bar{position:absolute;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 10px calc(10px + var(--sb));background:rgba(20,10,4,.88);border-top:3px solid #6B4226}
.cafe-bar button{min-height:58px;border-radius:14px;border:2px solid #8B5E3C;background:#3A2410;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:13px;padding:2px}
.cafe-bar button svg{width:22px;height:22px}
.cafe-bar button.hl{border-color:var(--gold);background:#5A3A18}

/* ---------- tutorial coach marks ---------- */
.tut{position:fixed;inset:0;z-index:66;pointer-events:none}
.tut[hidden]{display:none}
.tut-ring{position:fixed;border:4px solid var(--gold);border-radius:16px;box-shadow:0 0 0 9999px rgba(8,6,32,.55);pointer-events:none}
.tut-card{position:fixed;inset-inline:12px;max-width:440px;margin:0 auto;background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.tut-top{display:flex;align-items:center;gap:10px}
.tut-top b{font-family:'Lalezar',sans-serif;font-weight:400;font-size:20px;flex:1;color:var(--gold)}
.tut-x{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;text-decoration:underline;padding:4px}
.tut-card p{font-size:14px;line-height:1.6}
.tut-card .tut-h{color:var(--gold);font-size:12px}
.tut-dots{display:flex;gap:4px}
.tut-dots i{flex:1;height:5px;border-radius:3px;background:var(--deep)}
.tut-dots i.d{background:var(--teal)}
.tut-dots i.c{background:var(--gold)}
.tut-btns{display:flex;gap:8px;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){.tut-ring{animation:ringp .9s ease-in-out infinite alternate}@keyframes ringp{from{transform:scale(1)}to{transform:scale(1.04)}}}
@media (min-width:900px) and (min-height:560px){.tut-card{max-width:480px}}

/* ---------- help center ---------- */
.hp{background:var(--panel2);border-radius:12px;padding:0 12px}
.hp summary{min-height:44px;display:flex;align-items:center;font-weight:800;font-size:15px;cursor:pointer;list-style:none}
.hp summary::-webkit-details-marker{display:none}
.hp summary::after{content:'+';margin-inline-start:auto;font-size:22px;color:var(--gold)}
.hp[open] summary::after{content:'−'}
.hp p{font-size:14px;line-height:1.7;padding:0 0 12px;color:var(--muted)}
.os-help{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-weight:800;font-size:14px;padding:0;line-height:1}
.a-cust{animation:custm 5s ease-in-out infinite alternate}
.a-cust2{animation:custm 6s ease-in-out infinite alternate-reverse}
@keyframes custm{from{transform:translateX(-14px)}to{transform:translateX(14px)}}

.pill svg{width:16px;height:16px;flex:none}

</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <section class="stage" id="stage" aria-label="استوديوك">
    <canvas id="stCv" aria-label="استوديو ثلاثي الأبعاد"></canvas>
    <div class="stfb" id="stfb" hidden></div>
    <div class="slabels" id="slabels"></div>
    <div class="stchips" id="stchips"></div>
  </section>
  <footer class="dock" id="dock"></footer>
</div>
<div class="page" id="page" hidden></div>
<div class="map" id="map" hidden role="region" aria-label="خريطة المدينة">

  <div class="plabels" id="plabels"></div>
  <div class="map-fb" id="mapFb" hidden></div>
  <div class="map-hud">
    <button class="back" data-act="closeMap" aria-label="رجوع"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="map-title"><b>خريطة المدينة</b><span id="mapSub"></span></div>
    <button class="back sp" data-act="openHelp" aria-label="مساعدة">؟</button><div class="pill gold"><b class="disp" id="mapMoney"></b></div>
  </div>
  <div class="map-zoom"><button data-act="mapZoom" data-arg="in" aria-label="تقريب">+</button><button data-act="mapZoom" data-arg="out" aria-label="تبعيد">&minus;</button></div>
  <div class="map-hint" id="mapHint"></div>
  <div class="pbar" id="pbar"></div>
</div>
<div class="tour" id="tour" hidden role="dialog" aria-modal="true" aria-label="معاينة البيت"><canvas id="tourCv"></canvas><div class="tour-ui" id="tourUi"></div></div>
<div class="cafe" id="cafe" hidden role="region" aria-label="الكافيه">

  <div class="clabels" id="clabels"></div>
  <div class="map-fb" id="cafeFb" hidden></div>
  <div class="map-hud"><button class="back" data-act="cafeLeave" aria-label="خروج"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><div class="map-title"><b>كافيه النجوم</b><span id="cafeSub"></span></div><button class="back sp" data-act="openHelp" aria-label="مساعدة">؟</button><div class="pill gold"><b class="disp" id="cafeMoney"></b></div></div>
  <div class="cafe-bar" id="cafeBar"></div>
</div>
<div class="tut" id="tut" hidden></div>
<div class="live" id="live" hidden role="dialog" aria-modal="true" aria-label="بث مباشر"></div>
<div class="cam" id="cam" hidden role="dialog" aria-modal="true" aria-label="الكاميرا"></div>
<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="boot" id="boot" role="dialog" aria-modal="true" aria-label="شاشة التحميل">

  <span class="rise" style="inset-inline-start:30%;animation-delay:1.8s">اشترك</span>
  <span class="rise" style="inset-inline-start:58%;animation-delay:3.4s">ترند</span>
  <span class="rise" style="inset-inline-start:76%;animation-delay:.9s">بث مباشر</span>
  <span class="rise" style="inset-inline-start:18%;animation-delay:2.6s">تعليق</span>
  <span class="rise" style="inset-inline-start:64%;animation-delay:4.4s">فيروسي</span>

  try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const o=JSON.parse(raw);return o&&o.v===1?migrate(o):null}catch(e){return null}
}
const rk=(id)=>S.skills[id]|0;
const has=(id)=>rk(id)>0;
const hasPC=()=>S.eq.pc>=1;
const totalShifts=()=>Object.keys(S.jobs).reduce((a,k)=>a+(S.jobs[k].shifts||0),0);

/* ---------- toast ---------- */
function toast(msg,kind){
  const box=$('#toasts');const d=document.createElement('div');
  d.className='toast'+(kind?' '+kind:'');d.textContent=msg;box.appendChild(d);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d)},3400);
}

/* ---------- core mechanics ---------- */
function clampAll(){
  S.energy=clamp(S.energy,0,100);S.mood=clamp(S.mood,0,100);S.rep=clamp(S.rep,0,100);
  if(S.money<0)S.money=0;
}
function addXp(n){
  S.xp+=n;
  while(S.xp>=100*S.level){
    S.xp-=100*S.level;S.level++;S.sp++;S.energy=Math.min(100,S.energy+10);
    toast('ارتفع مستواك إلى '+S.level+'. حصلت على نقطة مهارة.','gold');
  }
}
function need(en){
  if(S.energy<en){toast('طاقتك لا تكفي ('+en+' مطلوبة). خذ استراحة أو أنهِ اليوم.','warn');return false}
  return true;
}
function spend(min,en){S.energy-=en;S.time+=min;}
function stepDone(){S.today.steps++;addXp(20)}
function moodF(){return 0.85+S.mood/100*0.3}

function maxBudget(){return clamp(Math.round((120+S.subs*0.1)/10)*10,100,2500)}
function capBudget(){return Math.max(0,Math.floor(Math.min(maxBudget(),S.money-GEN[ui.draft.genre].cost)/10)*10)}
function curBudget(){
  const c=capBudget();
  return ui.draft.budget==null?Math.min(c,Math.round(maxBudget()*0.3/10)*10):Math.min(ui.draft.budget,c);
}
function activeTeam(){return ui.draft.team.filter((id)=>{const m=TEAM.find((x)=>x.id===id);return m&&teamOk(m)})}
function startInfo(){
  const d=ui.draft,G=GEN[d.genre],B=curBudget();
  let t=0;activeTeam().forEach((id)=>{t+=TEAM.find((x)=>x.id===id).cost});
  return {cost:G.cost+B+t,en:5+Math.ceil(d.prep/12),tm:30+Math.round(d.prep*0.5),B:B};
}
const vTeam=(v,id)=>v.team.indexOf(id)>=0;
function shootInfo(v){
  const en=Math.max(5,20+GEN[v.genre].en+Math.floor(v.dur/8)-(vTeam(v,'karim')?4:0)+(vTeam(v,'sally')?6:0));
  return {en:en,tm:60+v.dur*6};
}
function editTime(v,n){return Math.max(30,60+v.dur*3-15*rk('quick')-S.eq.pc*8-(vTeam(v,'nour')?20:0))+n*10}
function fxMult(){return 1+0.34*rk('fx')}

function qScript(v){return clamp(Math.round((38+4*rk('write')+3*rk('story')+v.prep*0.08+rnd(0,22))*moodF()),10,100)}
const ZERO_EQ={};EQ_KEYS.forEach((k)=>{ZERO_EQ[k]=0});
function qImage(v,loc){
  const e=loc==='cafe'?ZERO_EQ:S.eq;
  return (28+e.camera*5+e.light*3+e.set*2+e.drone*4+v.bbonus+v.prep*0.06+(vTeam(v,'karim')?6:0)+(loc==='cafe'?9:rk('color')*2)+rnd(0,18))*moodF()+hq('img',loc);
}
function qAudio(loc){const e=loc==='cafe'?ZERO_EQ:S.eq;return (28+e.mic*5+e.acoustic*4+rnd(0,22)+(loc==='cafe'?-7:0))*moodF()+hq('aud',loc)}
function calcEdit(v,ids,trim){
  const m=fxMult();let fe=0,fa=0;
  ids.forEach((id)=>{const f=FX[id];if(f.t==='a')fa+=f.q*m;else fe+=f.q*m});
  let tr=0;Object.keys(trim).forEach((k)=>{if(trim[k])tr+=TRIM[k]});
  const edit=clamp(Math.round((30+S.eq.pc*6+S.eq.soft*3+rk('color')*2+fe+tr+(vTeam(v,'nour')?8:0)+rnd(0,18))*moodF()),10,100);
  return {edit:edit,aud:Math.round(fa)};
}
function overall(v){
  const q=v.q;let o=q.script*0.3+q.img*0.2+q.aud*0.15+q.edit*0.35;
  if(v.dur>14&&q.script<55)o-=6;
  if(v.dur<6)o-=3;
  return clamp(Math.round(o),5,100);
}
function goldenText(){
  const m=S.time;
  if(m>=1080&&m<1320)return 'الساعة الذهبية الآن';
  if(m<1080){const d=1080-m;return 'الساعة الذهبية بعد '+Math.floor(d/60)+' س و'+(d%60)+' د'}
  return 'فاتت الساعة الذهبية';
}
function genTitles(v){
  const T=TITLES[v.genre]||TITLES.fun;
  const f=(x)=>x.replace('{t}',v.topic);
  return [
    {tag:'فضول',text:f(T[0]),ctr:1.2,ret:1,rep:0},
    {tag:'مباشر',text:f(T[1]),ctr:0.9,ret:1.12,rep:0},
    {tag:'مبالغ فيه',text:f(T[2]),ctr:1.45,ret:0.85,rep:-2}
  ];
}
function ctrPct(t,f){return 4.2*t.ctr*f.m*(1+S.eq.set*0.03+S.eq.neon*0.03)}
function projectViews(v,t,f,slot){
  const q=v.quality/100;
  const base=S.subs*0.45+320;
  return base*(0.5+q)*GEN[v.genre].reach*(0.7+v.heat/100)*t.ctr*f.m*slot.m*(1+0.04*rk('viral'))*(0.8+S.rep/250)
    *(1+S.eq.set*0.03+S.eq.neon*0.03)*(DIFF[CFG.diff]||1)*(0.8+v.bold/100*0.4)*(vTeam(v,'sally')?1.15:1)*(v.loc==='cafe'?1.1:1)*HOUSES[S.house].view;
}
function convRate(v){
  return (0.006+v.quality/100*0.014)*(v.genre==='edu'?1.15:1)*(1+0.05*rk('community'))*(v.ret||1)*(0.9+S.rep/500);
}
function applyViews(v,views){
  const dm=(0.7+(v.dur||12)/20)/1.3;
  const m=views*0.025*(0.8+S.rep/250)*dm;
  S.views+=views;S.dayViews+=views;
  S.subs+=views*convRate(v);
  S.money+=m;S.incToday.ads+=m;
}

function checks(){
  clampAll();
  S.tasks.forEach((t)=>{
    if(!t.done&&S.today[t.key]>=t.need){
      t.done=true;const r=Math.round(t.reward*(1+S.subs/3000));S.money+=r;addXp(20);
      toast('أنجزت مهمة: '+t.t+' (+'+fmt(r)+')','gold');
    }
  });
  while(S.goals<GOALS.length&&Math.floor(S.subs)>=GOALS[S.goals].n){
    const g=GOALS[S.goals];S.money+=g.reward;S.goals++;
    toast('وصلت إلى '+g.name+'. مكافأة +'+fmt(g.reward),'gold');
    if(g.n===100000&&!S.won){S.won=true;S.pendingWin=true}
  }
  ACH.forEach((a)=>{if(!S.ach[a.id]&&a.t()){S.ach[a.id]=1;toast('إنجاز جديد: '+a.n,'gold')}});
}
function after(){
  if(S.time>=1440){endDay(true);return}
  checks();save();renderAll();tutRender();
}
function endDay(forced){
  S.published.forEach((v)=>{
    if(v.pending>0){const p=v.pending;v.pending=0;v.views+=p;applyViews(v,p)}
    if(v.remaining>0){
      const r=v.remaining>40?Math.round(v.remaining*0.5):v.remaining;
      v.remaining-=r;v.views+=r;applyViews(v,r);
    }
  });
  if(S.memOn){const m=Math.floor(S.subs*0.0008*(0.5+S.rep/100))*4;S.money+=m;S.incToday.mem+=m}
  if(S.merchOn){const m=Math.round(S.subs*0.0004*(0.5+S.rep/100)*20);S.money+=m;S.incToday.merch+=m}
  S.incHist.push(S.incToday);if(S.incHist.length>30)S.incHist.shift();
  S.incToday={ads:0,spons:0,mem:0,merch:0,jobs:0};
  S.streak=S.today.pub>0?S.streak+1:0;
  S.hist.push(Math.round(S.dayViews));if(S.hist.length>14)S.hist.shift();
  const dv=S.dayViews;S.dayViews=0;
  S.rivals.forEach((r)=>{r.s*=1+rnd(0.004,0.02)});
  {
    const HH=HOUSES[S.house];
    if(HH.rent>0){
      if(S.money>=HH.rent){S.money-=HH.rent;S.houseMiss=0}
      else{S.houseMiss++;if(S.houseMiss>=3){S.house=0;S.houseMiss=0;toast('تأخرت في الإيجار 3 أيام فعدت إلى القبو.','warn')}else toast('تأخرت في دفع الإيجار ('+S.houseMiss+' من 3).','warn')}
    }
  }
  S.day++;S.time=540;
  S.energy=clamp(S.energy+(forced?45:70)+S.eq.chair*2+hq('en'),0,100);
  S.mood=clamp(Math.round(S.mood+(72-S.mood)*0.35)+S.eq.plant*2+hq('mood'),0,100);
  if(S.sponsor){S.sponsor.days--;if(S.sponsor.days<=0){S.sponsor=null;toast('انتهى عرض الراعي.')}}
  if(!S.sponsor&&S.day>=3&&Math.random()<0.35)S.sponsor=genSponsor();
  S.heat=genHeat();S.comments=genComments(3);S.tasks=genTasks();S.deals=genDeals();S.jobsToday={};
  S.today={steps:0,replies:0,live:0,pub:0};
  checks();
  S.snap={money:S.money,subs:S.subs,views:S.views};
  if(S.day>=3&&Math.random()<0.22)S.event=ri(0,EVENTS.length-1);
  toast('اليوم '+S.day+' بدأ. مشاهدات أمس: '+fmt(dv),'gold');
  save();renderAll();
}
function commentEffect(c,primary){
  if(c.type==='love'){
    if(primary){S.mood+=3+rk('warm');S.subs+=ri(1,3)+rk('warm');addXp(4);S.today.replies++}
    else{S.subs+=1;S.mood+=1}
  }else if(c.type==='critic'){
    if(primary){S.rep+=1+(has('critics')?1:0);S.mood+=1;addXp(4);S.today.replies++}
    else{if(!has('critics'))S.mood-=2}
  }else{S.rep+=1;if(!primary)addXp(2)}
}

/* ---------- modal ---------- */
let lastFocus=null,evTimer=null;
function clearEv(){if(evTimer){clearInterval(evTimer);evTimer=null}}
function openModal(name){
  lastFocus=document.activeElement;ui.modal=name;ui.block=false;
  $('#overlay').hidden=false;renderModal(true);
}
function showInfo(title,html,block){
  clearEv();
  lastFocus=document.activeElement;ui.modal='info';ui.title=title;ui.html=html;ui.block=!!block;
  $('#overlay').hidden=false;renderModal(true);
}
function closeModal(silent){
  clearEv();
  ui.modal=null;ui.block=false;$('#overlay').hidden=true;$('#sheet').innerHTML='';
  if(!silent&&lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(e){}}
  if(S&&S.event!==null&&S.event!==undefined&&!ui.modal&&!ui.menu)showEvent();
  else if(S&&S.pendingWin&&!ui.modal&&!ui.menu)showWin();
}
function head(title,closable){
  return '<div class="sheet-h"><h2 id="sheetTitle">'+title+'</h2>'+(closable?'<button class="x" data-act="close" aria-label="إغلاق">إغلاق</button>':'')+'</div>';
}
function renderModal(first){
  if(!ui.modal)return;
  const sheet=$('#sheet');let h='';const m=ui.modal;
  if(m==='stats')h=statsHTML();
  else if(m==='menu')h=menuHTML();
  else if(m==='settings')h=settingsHTML();
  else if(m==='shopE')h=shopHTML('e');
  else if(m==='shopD')h=shopHTML('d');
  else if(m==='tasks')h=head('المهام والتقدم',true)+'<div class="cols">'+leftHTML()+'</div>';
  else if(m==='crowd')h=head('الجمهور والترندات',true)+'<div class="cols">'+commentsPanel()+sponsorPanel()+trendsPanel()+'</div>';
  else if(m==='spons')h=head('عروض الرعاة',true)+sponsorPanel();
  else if(m==='office')h=officeHTML();
  else if(m==='rent')h=rentHTML();
  else if(m==='cafeMenu')h=cafeMenuHTML();
  else if(m==='help')h=helpHTML();
  else if(m==='info')h=head(ui.title,!ui.block)+ui.html;
  sheet.className='sheet'+(m==='shopE'||m==='shopD'||m==='tasks'||m==='crowd'?' wide':'');
  sheet.innerHTML=h;
  if(first||!sheet.contains(document.activeElement)){sheet.focus({preventScroll:true})}
}

    +'<div class="panel"><span class="muted small">فيديوهات منشورة</span><b class="disp" style="font-size:28px">'+S.counts.videos+'</b></div>'
    +'<div class="panel"><span class="muted small">السمعة</span><b class="disp" style="font-size:28px;color:'+gcol(S.rep)+'">'+Math.round(S.rep)+'%</b></div></div>';
  h+='<div class="panel"><h2>المشاهدات آخر 14 يومًا</h2><div class="chart" role="img" aria-label="مخطط المشاهدات اليومية">'+hist.map((x)=>'<i style="height:'+Math.round(6+x/mx*150)+'px;'+(x===mx&&x>0?'background:var(--gold)':'')+'"></i>').join('')+'</div><div class="row small muted"><span>قبل 14 يومًا</span><span class="sp">اليوم</span></div></div>';
  const all=S.rivals.map((r)=>({n:r.n,s:r.s,me:false})).concat([{n:'قناتك: '+S.name,s:S.subs,me:true}]).sort((a,b)=>b.s-a.s);

  h+='<div class="panel"><h2>كل الإنجازات</h2>'+ACH.map((a)=>{const on=!!S.ach[a.id];return '<div class="ach'+(on?' on':'')+'"><i>'+(on?'✓':'·')+'</i><div style="display:flex;flex-direction:column"><b style="font-size:14px">'+a.n+'</b><span class="muted small">'+a.d+'</span></div></div>'}).join('')+'</div></div>';
  return h;
}

function showPage(name,focus){
  ui.page=name;ui.focus=focus||null;

function closePage(){
  ui.page=null;$('#page').hidden=true;$('#page').innerHTML='';

function renderPage(reset){
  if(!ui.page)return;
  const pg=$('#page');
  const top=reset?0:pg.scrollTop;
  const ae=document.activeElement;let key=null;
  if(ae&&pg.contains(ae)){
    if(ae.dataset.slider)key='[data-slider="'+ae.dataset.slider+'"]';
    else if(ae.dataset.act)key='[data-act="'+ae.dataset.act+'"][data-arg="'+(ae.dataset.arg||'')+'"]';
  }
  pg.innerHTML=ui.page==='studio'?studioPage():businessPage();
  pg.scrollTop=top;
  if(key){const el=pg.querySelector(key);if(el&&!el.disabled)el.focus({preventScroll:true})}
  if(ui.page==='business'&&ui.focus){
    const map={shop:'shopPanel',skills:'skillsPanel',ach:'achPanel'};
    const el=document.getElementById(map[ui.focus]);if(el)el.scrollIntoView({block:'start'});
    ui.focus=null;
  }
}

  ib+=unl(S.memOn,'عضويات القناة',500,'تحتاج 1,000 مشترك',S.subs>=1000,'mem')+unl(S.merchOn,'متجر المنتجات',2000,'تحتاج 5,000 مشترك',S.subs>=5000,'merch');
  c1+=P('مصادر الدخل الشهري',ib);
  const hist=S.hist.slice();while(hist.length<14)hist.unshift(0);
  const mx=Math.max(1,Math.max.apply(null,hist));
  const last=hist[hist.length-1],prev=hist.slice(0,7).reduce((a,b)=>a+b,0)/7||0,rec7=hist.slice(7).reduce((a,b)=>a+b,0)/7;
  const chg=prev>0?Math.round((rec7-prev)/prev*100):0;
  const rec5=S.published.slice(0,5);
  const avgW=rec5.length?rec5.reduce((a,r)=>a+(r.dur||12)*(0.3+r.quality/250),0)/rec5.length:0;
  const ret=clamp(Math.round(22+S.rep*0.25+rk('warm')*3+rk('community')*3),10,80);
  const lv=S.lastVid;
  const aud=[['نسبة المشاهد العائد',ret+'%'],['متوسط مدة المشاهدة',avgW?mmss(avgW):'—'],['أكبر فئة عمرية',lv?AGES[lv.genre]:'—'],['موعد الذروة',lv?lv.slot:'—']];
  c1+=P('المشاهدات آخر 14 يومًا','<div class="row small"><span class="sp" style="font-weight:800;color:'+(chg>=0?'var(--teal)':'var(--red)')+'">'+(prev>0?(chg>=0?'+':'')+chg+'% عن الأسبوع الماضي':'ابدأ بالنشر لتظهر المقارنة')+'</span></div>'

  }).join('');
  c2+='<div class="panel" id="shopPanel"><div class="row"><h2>متجر المعدات</h2><div class="steps sp">'+TABS.map((t)=>'<button class="chipb sm" data-act="bizTab" data-arg="'+t[0]+'" aria-pressed="'+(ui.bizTab===t[0])+'">'+t[1]+'</button>').join('')+'</div></div><div class="grid3">'+cards+'</div><p class="muted small">وفّر مع خصومات اليوم: زُر محلات الخريطة (الإلكترونيات والديكورات).</p></div>';

    sk+='<div class="sk" style="border-color:'+b.c+'"><span class="disp" style="font-size:22px;color:'+b.c+'">'+b.name+'</span>';
    b.nodes.forEach((n,i)=>{
      const r=rk(n.id),prevOk=i===0||rk(b.nodes[i-1].id)>0;
      const st=r>=3?'مكتملة 3/3':r>0?'مفتوحة '+r+'/3':prevOk?'1 نقطة':'مقفلة';
      sk+='<button class="node '+(r>0?'on':prevOk?'open':'')+'" data-act="skill" data-arg="'+n.id+'"><span class="nr"><b>'+n.n+'</b><span class="ns" style="color:'+(r>0?'var(--teal)':prevOk?'var(--gold)':'var(--dim)')+'">'+st+'</span></span><span class="nd">'+n.d+'</span></button>';
    });
    sk+='</div>';
  });
  sk+='</div>';
  c2+='<div class="panel" id="skillsPanel"><div class="row"><h2>شجرة المهارات</h2><span class="sp muted small">كل مهارة تُفتح بنقطة، ولها 3 رتب</span></div>'+sk+'</div>';
  c2+='</div>';

  /* left: rivals, achievements, event */
  const all=S.rivals.map((r)=>({n:r.n,s:r.s,me:false})).concat([{n:'قناتك: '+S.name,s:S.subs,me:true}]).sort((a,b)=>b.s-a.s);
  const mi=all.findIndex((x)=>x.me),st=clamp(mi-2,0,Math.max(0,all.length-5));
  let c3='<div class="col">';
  c3+=P('ترتيب المنافسين',all.slice(st,st+5).map((r,i)=>'<div class="rv'+(r.me?' me':'')+'"><b>'+(st+i+1)+'</b><b style="flex:1;font-size:14px">'+esc(r.n)+'</b><span class="small" style="font-weight:800">'+fmtK(r.s)+'</span></div>').join(''));
  const done=ACH.filter((a)=>S.ach[a.id]),todo=ACH.filter((a)=>!S.ach[a.id]);
  const ratio=(a)=>a.p?a.p()[0]/a.p()[1]:0;
  todo.sort((a,b)=>ratio(b)-ratio(a));
  const d2=done.slice(-2),show=d2.concat(todo.slice(0,4-d2.length));

    const on=!!S.ach[a.id],p=a.p?a.p():null;

  }).join('')+'</div>';
  const le=S.lastEvent;
  c3+='<div class="ev">'+(le?'<div class="row"><b class="disp" style="font-size:22px">حدث طارئ</b><span class="sp tmr">آخر حدث</span></div><b>'+le.t+'</b><span style="font-size:14px">'+le.d+'</span><div class="evr"><b>قرارك: '+le.o+'</b><span>'+le.r+'</span></div>':'<b class="disp" style="font-size:22px">حدث طارئ</b><span style="font-size:14px">لا أحداث الآن. قد يظهر حدث طارئ في أي يوم، وتملك 10 ثوانٍ لتقرر.</span>')+'</div>';
  c3+='</div>';

  return h+c1+c2+c3+'</div>';

      +'<span class="small">'+e.e+'</span><div class="pips">'+pips+'</div>'
      +(pct&&!max&&!lockS?'<span class="small"><span class="strike">'+fmt(old)+'</span><b style="color:var(--gold)">'+fmt(price)+'</b></span>':'')
      +'<button class="btn'+(max?' teal':'')+'" style="font-size:18px;min-height:44px" data-act="shopBuy" data-arg="'+k+'"'+(max||lockS||S.money<price?' disabled':'')+'>'+label+'</button></div>';

let TH=null;
function initMap3D(){
  const T=window.THREE;
  if(!T)return false;
  const cv=$('#mapCv');
  let gl=null;try{gl=cv.getContext('webgl')||cv.getContext('experimental-webgl')}catch(e){}
  if(!gl)return false;
  const renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(gfxRatio());
  const scene=new T.Scene();
  scene.background=new T.Color(0x8FD1FF);
  scene.fog=new T.Fog(0x8FD1FF,70,150);
  const camera=new T.PerspectiveCamera(42,2,0.5,260);
  const hemi=new T.HemisphereLight(0xffffff,0x6C63B8,0.95);scene.add(hemi);
  const sun=new T.DirectionalLight(0xFFF3D6,0.9);sun.position.set(-20,30,20);scene.add(sun);
  const ray=new T.Raycaster();
  const L=(c,o)=>new T.MeshLambertMaterial(Object.assign({color:c},o||{}));
  const Bm=(c)=>new T.MeshBasicMaterial({color:c});
  const add=(geo,mat,x,y,z,p)=>{const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(p)p.add(m);return m};
  const box=(w,h,d,mat,x,y,z,p)=>add(new T.BoxGeometry(w,h,d),mat,x,y,z,p);
  const cyl=(rt,rb,h,seg,mat,x,y,z,p)=>add(new T.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p);
  const sph=(r,mat,x,y,z,p,ws,hs)=>add(new T.SphereGeometry(r,ws||12,hs||9),mat,x,y,z,p);
  const cone=(r,h,seg,mat,x,y,z,p)=>add(new T.ConeGeometry(r,h,seg),mat,x,y,z,p);
  const plane=(w,h,mat,x,y,z,p)=>add(new T.PlaneGeometry(w,h),mat,x,y,z,p);
  const shadow=(w,d,x,z,p)=>{const m=plane(w,d,new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.2}),x,0.03,z,p);m.rotation.x=-Math.PI/2;return m};

  const winMats=[],lampMats=[],pickables=[],floaters=[],cars=[],clouds=[],npcs=[],spray=[];
  const winMat=()=>{const m=new T.MeshBasicMaterial({color:0x9ED9FF});winMats.push(m);return m};
  function tex(draw,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new T.CanvasTexture(c);t.minFilter=T.LinearFilter;t.generateMipmaps=false;return {t:t,c:c,x:x};}
  function signTex(text,bg,fg,w,h,fs){
    return tex((x,W,H)=>{
      x.fillStyle=bg;x.fillRect(0,0,W,H);
      x.strokeStyle=fg;x.lineWidth=8;x.strokeRect(8,8,W-16,H-16);
      x.fillStyle=fg;x.font=(fs||80)+'px Lalezar, Tajawal, sans-serif';x.textAlign='center';x.textBaseline='middle';
      try{x.direction='rtl'}catch(e){}
      x.fillText(text,W/2,H/2+4);
    },w||512,h||160).t;
  }
  function screenTex(kind){
    return tex((x,W,H)=>{
      x.fillStyle='#0E0A2B';x.fillRect(0,0,W,H);
      if(kind===0){x.fillStyle='#FF4D5E';x.fillRect(W*0.2,H*0.2,W*0.6,H*0.6);x.fillStyle='#fff';x.beginPath();x.moveTo(W*0.45,H*0.33);x.lineTo(W*0.62,H*0.5);x.lineTo(W*0.45,H*0.67);x.fill();}
      else if(kind===1){const cs=['#FF4D5E','#FFC93C','#35E0C0','#5AB0FF','#FF7AC6'];cs.forEach((c,i)=>{x.fillStyle=c;x.fillRect(W*(0.08+i*0.17),H*0.2,W*0.13,H*0.6)});}
      else {x.strokeStyle='#35E0C0';x.lineWidth=6;x.beginPath();x.moveTo(8,H*0.8);x.lineTo(W*0.3,H*0.55);x.lineTo(W*0.5,H*0.65);x.lineTo(W*0.9,H*0.2);x.stroke();}
    },128,80).t;
  }
  function openSign(){
    const o=tex((x,W,H)=>{},192,96);
    o.draw=(open)=>{const x=o.x,W=192,H=96;x.clearRect(0,0,W,H);x.fillStyle=open?'#35E0C0':'#FF4D5E';x.fillRect(0,0,W,H);x.strokeStyle='#14103A';x.lineWidth=8;x.strokeRect(4,4,W-8,H-8);x.fillStyle='#14103A';x.font='56px Lalezar, Tajawal, sans-serif';x.textAlign='center';x.textBaseline='middle';try{x.direction='rtl'}catch(e){}x.fillText(open?'مفتوح':'مغلق',W/2,H/2+3);o.t.needsUpdate=true};
    return o;
  }
  const mark=(g,id)=>{g.traverse((m)=>{if(m.isMesh){m.userData.place=id;pickables.push(m)}})};

  /* ground */
  const grass=L(0x4FB06B);
  box(180,0.4,120,grass,0,-0.2,10);
  box(130,0.16,5.2,L(0xBDB5F2),0,0.08,-3.1);           // sidewalk strip
  box(130,0.12,6,L(0x2C2750),0,0.06,11.5);              // road
  for(let i=-20;i<=20;i++)box(2.4,0.02,0.22,Bm(0xF4F1FF),i*4.4,0.13,11.5);
  box(130,0.14,0.5,L(0xE6E1FF),0,0.1,8.2);box(130,0.14,0.5,L(0xE6E1FF),0,0.1,14.8);   // curbs

  });

  });

    const r=cv.getBoundingClientRect();

    cars.forEach((c)=>{c.g.position.x+=c.v*dt;if(c.g.position.x>66)c.g.position.x=-66;if(c.g.position.x<-66)c.g.position.x=66});
    clouds.forEach((c)=>{c.g.position.x+=c.v*dt;if(c.g.position.x>90)c.g.position.x=-90});

    applyTime(false);

    const ls=labels();

      const x=(tmp.x*0.5+0.5)*MAP.w,y=(-tmp.y*0.5+0.5)*MAP.h;

      el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,-100%)';});
  }
  TH.step=step;
  TH.render=()=>renderer.render(scene,camera);
  window.addEventListener('resize',()=>{if(ui.map)resize()});
  if(window.ResizeObserver)new ResizeObserver(()=>{if(ui.map)resize()}).observe($('#map'));
  return true;
}

    if(!MAP.running||tok!==MAP.token)return;

function syncStudio(){
  const should=!ui.menu&&!ui.page&&!ui.map;
  if(!SD)return;
  const sig=studioSig();
  if(sig!==SD.sig){
    const prev=ST.shown||{};const changed=EQ_KEYS.filter((k)=>prev[k]!==S.eq[k]&&prev[k]!=null&&S.eq[k]>prev[k]);
    SD.rebuild();
    if(should&&ST.running)SD.popKeys(changed);else ST.pending=ST.pending.concat(changed);
  }
  ST.shown=Object.assign({},S.eq);
  if(should&&!ST.running){
    ST.running=true;ST.last=performance.now();SD.resize();
    if(ST.pending.length){SD.popKeys(ST.pending);ST.pending=[]}
    const tok=++ST.token,t0=performance.now();
    (function loop(now){
      if(!ST.running||tok!==ST.token)return;
      requestAnimationFrame(loop);
      const dt=Math.min(0.05,Math.max(0.001,(now-ST.last)/1000));ST.last=now;
      try{SD.step(dt,(now-t0)/1000);SD.render()}catch(err){ST.running=false;ST.ok=false;ST.err=String((err&&err.message)||err);if(window.console)console.error(err);showStageFallback()}
    })(performance.now());
  }else if(!should&&ST.running){ST.running=false}
}

function startShootGame(opt){

  const kinds=['focus','zoom','light','audio','focus','zoom','focus','audio','light','focus','zoom','audio'];
  const off=ri(0,kinds.length-1);
  CG.ev=[];

    const type=kinds[(off+i*5)%kinds.length];const pt=pick(pts);

  }

function camResolve(ev,hit,why){

  if(hit){CG.hits++;if(img)CG.hitImg++;else CG.hitAud++}
  else{if(img)CG.missImg++;else CG.missAud++}
  camFb(hit?(why||'ممتاز!'):'فاتك!',hit,ev.type==='focus'?ev.x:0.5,ev.type==='focus'?ev.y-0.1:0.42);

  });
  if(t>=CG.end)endShootGame();
}
function camPress(kind,btn){
  if(!CG.on)return;
  const ev=CG.cur;
  const wrongPress=()=>{CG.wrong++;if(btn){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake')}};
  if(!ev||ev.state!==1){wrongPress();return}
  if(kind==='light'&&ev.type==='light')camResolve(ev,true);
  else if(kind==='mic'&&ev.type==='audio')camResolve(ev,true);
  else if((kind==='zin'||kind==='zout')&&ev.type==='zoom'){
    if((kind==='zin')===(ev.dir>0))camResolve(ev,true);else camResolve(ev,false);
  }else wrongPress();
}
function camTap(x,y){
  if(!CG.on)return;
  const ev=CG.cur;if(!ev||ev.state!==1||ev.type!=='focus')return;
  const view=$('#camView').getBoundingClientRect();
  const cx=view.left+ev.x*view.width,cy=view.top+ev.y*view.height;
  if(Math.hypot(x-cx,y-cy)<=56)camResolve(ev,true);
  else CG.wrong+=0.5;
}
function endShootGame(){
  if(!CG.on)return;
  CG.on=false;cancelAnimationFrame(CG.raf);
  CG.ev.forEach((ev)=>{if(ev.state!==2){ev.state=1;camResolve(ev,false)}});
  $('#cam').hidden=true;$('#cam').innerHTML='';
  if(!ui.menu&&!ui.map)$('#app').inert=!!(ui.page||ui.map);
  const perfect=CG.hits===CG.total&&CG.wrong<1;
  finishShoot({loc:CG.loc,auto:false,missImg:CG.missImg,missAud:CG.missAud,hitImg:CG.hitImg,hitAud:CG.hitAud,wrong:CG.wrong,perfect:perfect,hits:CG.hits,total:CG.total});
}
function finishShoot(r){
  const v=S.video;if(!v)return;
  if(SD&&SD.restoreSeat)SD.restoreSeat();
  let img=qImage(v,r.loc),aud=qAudio(r.loc);
  if(r.auto){
    img*=0.85;aud*=0.85;
    if(Math.random()<Math.max(0,70-v.prep)/250){img-=10;aud-=6;toast('حدث خطأ أثناء التصوير وانخفضت الجودة.','warn')}
  }else{
    img-=r.missImg*5+r.wrong*1.2;aud-=r.missAud*7+r.wrong*0.8;
    img+=Math.min(6,r.hitImg*1.2);aud+=Math.min(6,r.hitAud*1.2);
    if(r.perfect){img+=4;aud+=4;S.perfects++}
  }
  v.q.img=clamp(Math.round(img),10,100);v.q.aud=clamp(Math.round(aud),10,100);
  v.q.shoot=Math.round(v.q.img*0.6+v.q.aud*0.4);v.stage='edit';v.loc=r.loc==='cafe'?'cafe':'studio';
  if(v.genre==='vlog')S.mood+=4;
  stepDone();
  checks();save();
  if(S.time>=1440){endDay(true)}else renderAll();
  if(r.auto){toast('تصوير تلقائي: الصورة '+v.q.img+' والصوت '+v.q.aud)}
  else{
    showInfo('انتهى التصوير',
      '<div class="grid2"><div class="panel"><span class="muted small">أصبت</span><b class="disp" style="font-size:30px;color:var(--teal)">'+r.hits+' من '+r.total+'</b></div>'
      +'<div class="panel"><span class="muted small">أخطأت</span><b class="disp" style="font-size:30px;color:'+(r.total-r.hits?'var(--red)':'var(--teal)')+'">'+(r.total-r.hits)+'</b></div>'
      +'<div class="panel"><span class="muted small">جودة الصورة</span><b class="disp" style="font-size:30px;color:'+gcol(v.q.img)+'">'+v.q.img+'</b></div>'
      +'<div class="panel"><span class="muted small">جودة الصوت</span><b class="disp" style="font-size:30px;color:'+gcol(v.q.aud)+'">'+v.q.aud+'</b></div></div>'
      +(r.perfect?'<div class="ev" style="background:var(--gold)"><b class="disp" style="font-size:22px">تصوير مثالي!</b><span>لم يفتك أي زر. مكافأة جودة +4.</span></div>':'<p class="muted small">كل زر يفوتك يخفض جودة الصورة أو الصوت. ترقية الكاميرا والإضاءة والميكروفون تضيف مساعدات تلقائية.</p>')
      +'<div class="foot"><button class="btn block" data-act="close">متابعة</button></div>',false);
  }
}
document.addEventListener('pointerdown',(e)=>{
  if(!CG.on)return;
  const b=e.target.closest&&e.target.closest('[data-cam]');
  if(b){camPress(b.dataset.cam,b);return}

document.addEventListener('change',(e)=>{
  const el=e.target;if(!el||el.id!=='zLogo'||!el.files||!el.files[0])return;

      const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
      const m=Math.min(img.width,img.height);

      let data=c.toDataURL('image/webp',0.85);if(data.indexOf('image/webp')<0)data=c.toDataURL('image/jpeg',0.85);
      ui.zee.logo=data;

    };

  };

});

function startLive(){

  if(S.time>=1380){toast('الوقت متأخر للبث. أنهِ يومك.','warn');return}
  const e=S.eq,sw=S.sw;
  LV.base=(3+sw.followers*0.18+S.subs*0.004)*(0.85+(e.camera+e.light+e.mic)*0.035)*(DIFF[CFG.diff]||1);
  LV.v=Math.max(2,LV.base*0.55);LV.peak=Math.round(LV.v);LV.hype=40;LV.hypeSum=0;LV.hypeN=0;LV.newF=0;LV.money=0;LV.acc=0;LV.actT=1.2;LV.t=0;LV.msgs={};LV.auto=false;

    +'<div class="lv-float" id="lvFloat"></div></div>'
    +'<div class="lv-bottom"><div class="lv-hype"><span>الحماس</span><div class="bar-t"><i id="lvHype"></i></div><b id="lvHv">40</b></div>'

    +'<div class="lv-ctl"><div class="lv-money"><span>تبرعات</span><b id="lvM">0</b></div><button class="btn red" data-act="liveEnd">إنهاء البث</button></div></div>';
  root.hidden=false;$('#app').inert=true;LV.on=true;
  liveMsg('system','Switch','بدأ البث! ردّ على الأسئلة، اشكر الهدايا، واحظر المزعجين.');
  const t0=performance.now();LV.last=t0;
  (function loop(now){
    if(!LV.on)return;
    LV.raf=requestAnimationFrame(loop);
    const dt=Math.min(0.1,(now-LV.last)/1000);LV.last=now;liveTick(dt);
  })(t0);
}
function liveMsg(type,name,text){
  const chat=$('#lvChat');if(!chat)return null;
  const id=++LV.id;
  const act=type==='q'||type==='troll'||type==='gift';
  const el=document.createElement(act?'button':'div');
  el.className='lv-msg t-'+type;
  el.innerHTML='<b>'+esc(name)+'</b><span>'+esc(text)+'</span>'+(act?'<i class="lv-cd"></i><em>'+(type==='q'?'ردّ':type==='troll'?'حظر':'شكرًا')+'</em>':'');
  if(act){el.dataset.lv=id;LV.msgs[id]={el:el,type:type,t:0,ttl:4.2,gv:0}}
  chat.appendChild(el);
  while(chat.children.length>26)chat.removeChild(chat.firstChild);
  chat.scrollTop=chat.scrollHeight;
  return id;
}
function liveSpawn(vi){
  const r=Math.random();
  const nm=pick(LV_NAMES);
  if(r<0.05&&vi>4){S.sw.followers; LV.newF++;liveMsg('follow',nm,pick(LV_TXT.follow));liveFloat('+متابع','good')}
  else liveMsg('chat',nm,pick(LV_TXT.chat));
}
function liveAct(vi){
  const r=Math.random();
  const trollP=clamp(0.34*(1.35-S.rep/100)*(1-LV.hype/220),0.08,0.45);
  const giftP=clamp(0.14+Math.min(0.2,S.sw.followers/400),0.14,0.34);
  if(r<trollP)liveMsg('troll',pick(LV_NAMES),pick(LV_TXT.troll));
  else if(r<trollP+giftP){const id=liveMsg('gift',pick(LV_NAMES),pick(LV_TXT.gift));if(id)LV.msgs[id].gv=Math.round((3+vi*0.35+S.sw.followers*0.05)*rnd(0.8,1.4))}
  else liveMsg('q',pick(LV_NAMES),pick(LV_TXT.q));
}
function liveResolve(id,hit){
  const m=LV.msgs[id];if(!m)return;
  delete LV.msgs[id];
  if(m.el&&m.el.parentNode){m.el.classList.add(hit?'done':'miss');m.el.disabled=true}
  if(hit){
    if(m.type==='q'){LV.hype+=8;liveFloat('+8 حماس','good');liveReact('r-happy')}
    else if(m.type==='troll'){LV.hype+=3;liveFloat('تم الحظر','good')}
    else{LV.hype+=9;LV.money+=m.gv;liveFloat('+'+m.gv+' رصيد','gold');liveReact('r-happy')}
  }else{
    if(m.type==='q'){LV.hype-=5;liveFloat('فاتك سؤال','bad')}
    else if(m.type==='troll'){LV.hype-=8;liveFloat('إزعاج!','bad');liveReact('r-shock');S.mood=Math.max(0,S.mood-1)}
    else{liveFloat('ضاعت هدية','bad')}
  }
  LV.hype=clamp(LV.hype,0,100);
}
function liveTick(dt){
  LV.t+=dt;
  const mins=LV.t*LV_TS,en=S.energy-LV.t*LV_EN;
  LV.hype=clamp(LV.hype-dt*0.9,0,100);
  LV.hypeSum+=LV.hype;LV.hypeN++;
  const tgt=LV.base*(0.35+LV.hype/100*1.25);
  LV.v+=(tgt-LV.v)*Math.min(1,dt*0.6);
  const vi=Math.max(1,Math.round(LV.v));LV.peak=Math.max(LV.peak,vi);
  const lam=clamp(0.25+Math.sqrt(vi)*0.30,0.25,6);
  LV.acc+=dt*lam;
  while(LV.acc>=1){LV.acc-=1;liveSpawn(vi)}
  LV.actT-=dt;
  if(LV.actT<=0){liveAct(vi);LV.actT=clamp(2.4-vi/160,1.0,2.4)*rnd(0.8,1.25)}
  Object.keys(LV.msgs).forEach((k)=>{
    const m=LV.msgs[k];m.t+=dt;
    if(m.el){const cd=m.el.querySelector('.lv-cd');if(cd)cd.style.transform='scaleX('+Math.max(0,1-m.t/m.ttl)+')'}
    if(m.t>=m.ttl)liveResolve(k,false);
  });
  const set=(id,txt)=>{const x=document.getElementById(id);if(x)x.textContent=txt};
  set('lvV',fmt(vi)+' مشاهد');
  set('lvT',String(Math.floor(LV.t/60)).padStart(2,'0')+':'+String(Math.floor(LV.t%60)).padStart(2,'0'));
  set('lvE',Math.max(0,Math.round(en))+' طاقة');
  set('lvM',fmt(LV.money));set('lvHv',String(Math.round(LV.hype)));
  const hb=document.getElementById('lvHype');if(hb){hb.style.width=LV.hype+'%';hb.style.background=LV.hype<30?'var(--red)':LV.hype<60?'var(--gold)':'var(--teal)'}
  if(en<=3||S.time+mins>=1380){LV.auto=true;endLive()}
}
function endLive(){
  if(!LV.on)return;
  LV.on=false;cancelAnimationFrame(LV.raf);
  const mins=Math.max(20,Math.round(LV.t*LV_TS));
  const en=Math.round(clamp(LV.t*LV_EN,4,S.energy));
  const avgH=LV.hypeSum/Math.max(1,LV.hypeN);
  const gain=Math.max(0,Math.round(LV.newF+LV.peak*0.05*(avgH/50)));
  const money=Math.round(LV.money);
  $('#live').hidden=true;$('#live').innerHTML='';
  spend(Math.min(mins,1439-S.time),en);
  const sw=S.sw;
  sw.followers+=gain;sw.streams++;sw.peak=Math.max(sw.peak,LV.peak);sw.earned+=money;
  sw.hist.unshift({day:S.day,peak:LV.peak,gain:gain,money:money,mins:mins});sw.hist=sw.hist.slice(0,6);
  S.money+=money;S.incToday.mem+=money;
  S.mood+=avgH>55?4:avgH<30?-2:1;
  S.today.live++;S.counts.lives++;S.maxLive=Math.max(S.maxLive,LV.peak);
  addXp(30+Math.round(mins/6));
  checks();save();
  if(S.time>=1440){endDay(true)}else renderAll();
  showInfo('انتهى البث',
    (LV.auto?'<p class="muted">انتهى البث تلقائيًا بسبب التعب أو تأخر الوقت.</p>':'')
    +'<div class="grid2"><div class="panel"><span class="muted small">ذروة المشاهدين</span><b class="disp" style="font-size:30px;color:var(--teal)">'+fmt(LV.peak)+'</b></div>'
    +'<div class="panel"><span class="muted small">متابعون جدد على Switch</span><b class="disp" style="font-size:30px;color:var(--gold)">+'+fmt(gain)+'</b></div>'
    +'<div class="panel"><span class="muted small">التبرعات</span><b class="disp" style="font-size:30px;color:var(--gold)">'+fmt(money)+'</b></div>'
    +'<div class="panel"><span class="muted small">مدة البث</span><b class="disp" style="font-size:30px">'+mins+' د</b></div></div>'
    +'<p class="muted small">إجمالي متابعيك على Switch الآن: '+fmt(sw.followers)+'. كلما زاد متابعوك زاد جمهورك في البث القادم.</p>'
    +'<div class="foot"><button class="btn block" data-act="close">متابعة</button></div>',false);
}

function leaveCafe(){
  ui.cafe=false;$('#cafe').hidden=true;CF.running=false;CF.tok++;
}
function startCafe(){
  if(!CFD||CF.running)return;
  CF.running=true;const tok=++CF.tok,t0=performance.now();let last=t0;
  CFD.resize();
  (function loop(now){
    if(!CF.running||tok!==CF.tok)return;
    requestAnimationFrame(loop);
    const dt=Math.min(0.05,Math.max(0.001,(now-last)/1000));last=now;
    try{CFD.step(dt,(now-t0)/1000);CFD.render()}catch(err){CF.running=false;CF.ok=false;CF.err=String((err&&err.message)||err);if(window.console)console.error(err)}
  })(t0);
}
