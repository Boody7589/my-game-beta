  ['التصوير وميني جيم الكاميرا','اضغط الكاميرا في الاستوديو (أو «اذهب إلى الكاميرا») فتقف شخصيتك أمامها قاعدة أو واقفة حسب نوع الفيديو. اضغط داخل دائرة التركيز، والتقريب أو التبعيد المطلوب، والضوء عند التعتيم، والصوت عند ارتفاعه. كل زر يفوتك يخفض الجودة. المعدات الجيدة تساعدك تلقائيًا.'],
  ['المونتاج','اضغط على مقاطع الخط الزمني لتقصّها: قصّ المقدمة والمحتوى الطويل يحسّن الإيقاع، ولا تقصّ الذروة. أضف مؤثرات (بعضها يحتاج حاسوبًا). حاسوب أفضل وبرنامج مونتاج يرفعان الجودة.'],
  ['ZEETube والنشر','ZEETube منصة الفيديوهات. أنشئ قناتك باسم وشعار من جهازك. من «رفع» اختر العنوان (المبالغ فيه ينقر أكثر لكنه يضر السمعة) وتعبير الصورة وموعد النشر. الساعة الذهبية (6 إلى 10 مساءً) تزيد المشاهدات.'],
  ['Switch والبث المباشر','Switch منصة بث منفصلة بمتابعين خاصين. ابدأ البث وردّ على الأسئلة، اشكر الهدايا، واحظر المزعجين لترفع الحماس والمشاهدين. التعليقات تزيد بزيادة المشاهدين. أنت تنهي البث بنفسك، ويتوقف تلقائيًا لو تعبت.'],
  ['المعدات والمحلات','من الخريطة: محل الإلكترونيات (كاميرا، إضاءة، ميكروفون، حاسوب...) ومحل الديكورات (خلفية، نيون، كرسي، نباتات). كل قطعة تتغير في استوديوك ثلاثي الأبعاد وتحسّن الجودة. الخصومات تتجدد يوميًا، والمحلات تغلق ليلًا.'],
  ['البيوت ومكتب التأجير','تبدأ في قبو قديم. من مكتب التأجير تعاين البيوت بالـ3D ثم تنتقل لبيت أحسن: شقة بسيطة ثم عصرية ثم بنتهاوس. البيت الأفضل يحسّن الصورة والصوت وطاقتك ليلًا، لكن إيجاره يُخصم يوميًا. لو تأخرت 3 أيام تعود للقبو.'],
  ['الكافيه','في الكافيه ترى زبائن يطلبون مشروبات. اطلب من القائمة لتستعيد طاقتك ومزاجك. وتقدر تصوّر فيديو أو تبث بجوالك داخل الكافيه، وتكون الخلفية هي الكافيه فعلًا (بدون مساعدة معدات الاستوديو).'],
  ['الوظائف','في مكتب التوظيف تشتغل ورديات تأخذ ساعات من يومك وتعطيك مالًا. الوظيفة التالية تُفتح بعد أن تعمل فترة في السابقة. مفيدة في البداية لو رصيدك قليل.'],
  ['المهام والإنجازات والمهارات','المهام اليومية تعطيك مكافآت. الإنجازات تظهر جوائز على رف الاستوديو. مع كل مستوى تحصل على نقطة مهارة تفتح مزايا في «الأعمال».'],
  ['الأعمال والدخل','في «الأعمال» ترى دخلك من الإعلانات والرعاة والعضويات والمنتجات والوظائف، والمنافسين، وشجرة المهارات. فعّل العضويات والمتجر عند وصول عدد مشتركين كافٍ لدخل يومي ثابت.']
];
function ctxHints(){
  if(CG.on)return ['اضغط الأزرار في وقتها.','الدائرة: اضغط داخلها قبل أن تنقبض.','الأخطاء تخفض جودة الفيديو.'];
  if(LV.on)return ['اضغط الأسئلة للرد وزيادة الحماس.','اشكر الهدايا لتأخذ التبرعات.','احظر المزعجين قبل أن ينتهي وقتهم.','اضغط «إنهاء البث» عندما تريد.'];
  if(ui.cafe)return ['اضغط الباريستا أو «القائمة» لتطلب.','«صوّر هنا» و«بث من هنا» يستخدمان جوالك فقط.','اضغط زبونًا لتتحدث معه.'];
  if(ui.map)return ['اضغط أي مبنى أو اختر من الشريط للذهاب إليه.','المحلات تغلق في المساء، والزيارة تأخذ 15 دقيقة.','«مكتب التأجير» لمعاينة البيوت والانتقال.'];
  if(ui.page==='studio'){
    const a=ui.sos.app;
    if(!a)return ['هذه شاشة جوالك أو حاسوبك. افتح التطبيق الذي عليه إطار ذهبي، فهو الخطوة التالية.','ZEETube للنشر، وSwitch للبث.'];
    return {ideas:['اختر النوع والموضوع (السخونة الأعلى أفضل).','الميزانية والتحضير يرفعان الجودة.','ثم «ابدأ الفيديو» ثم «اكتب السيناريو».'],cam:['اضغط «اذهب إلى الكاميرا» لتبدأ التصوير.','معداتك الجيدة تساعدك تلقائيًا.'],edit:['اضغط مقاطع الفيديو لقصّها وأضف مؤثرات ثم ابدأ المونتاج.'],thumb:['اختر تعبير الوجه والعنوان والجدولة ثم ارفع على ZEETube.'],zee:['أنشئ قناتك أولًا، ثم ارفع فيديوهاتك من زر «رفع».'],switch:['اضغط «ابدأ بثًا مباشرًا». المتابعون هنا مستقلون عن ZEETube.'],full:['الورشة الكاملة: كل خطوات الفيديو في مكان واحد بثلاثة تابات.']}[a]||[];
  }
  if(ui.page==='business')return ['تابع دخلك ومنافسيك.','افتح المهارات بنقاط المستوى.','فعّل العضويات والمتجر عند توفر المشتركين.'];
  return ['اضغط «الورشة» لتصنع فيديو.','«الخريطة» للمحلات والتأجير والوظائف والكافيه.','اضغط الأشياء في الاستوديو: الحاسوب والكاميرا والباب والرف.'];
}
function helpHTML(){
  let h=head('المساعدة والتلميحات',true);
  const ch=ctxHints();
  if(ch.length)h+='<div class="panel"><h2>في هذه الشاشة</h2>'+ch.map((x)=>'<p class="small">• '+x+'</p>').join('')+'</div>';
  h+='<div class="panel"><h2>اشرح لي</h2>'+HELP_TOPICS.map((t)=>'<details class="hp"><summary>'+t[0]+'</summary><p>'+t[1]+'</p></details>').join('')+'</div>';
  h+='<div class="foot"><button class="btn" data-act="tutRestart">أعد الشرح التفاعلي</button><button class="btn ghost" data-act="close">إغلاق</button></div>';
  return h;
}

/* ---------- sliders ---------- */
function updateStartMeta(){
  const m=$('#stMeta'),b=$('#stBtn');if(!m||!b||S.video)return;
  const i=startInfo();m.textContent=metaText(i);b.disabled=S.money<i.cost||S.energy<i.en;
}
document.addEventListener('input',(e)=>{
  const el=e.target;if(!el||!el.dataset||!el.dataset.slider||S.video)return;
  const k=el.dataset.slider,val=+el.value;
  ui.draft[k]=val;
  const min=+el.min,max=+el.max;
  el.style.setProperty('--p',(max>min?(val-min)/(max-min)*100:0)+'%');
  const sv=document.getElementById('sv-'+k);
  if(sv)sv.textContent=k==='budget'?fmt(val):k==='dur'?val+' دقيقة':k==='bold'?boldLabel(val):val+'%';
  updateStartMeta();
});

/* ---------- boot ---------- */
document.addEventListener('click',(e)=>{
  const ov=$('#overlay');
  if(e.target===ov&&!ui.block){closeModal();return}
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const fn=acts[b.dataset.act];
  if(fn)fn(b.dataset.arg,b);
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(ui.modal&&!ui.block)closeModal();
    else if(!ui.modal&&ui.map&&!ui.menu)closeMap();
    else if(!ui.modal&&ui.page&&!ui.menu)closePage();
  }
  if(e.key==='Enter'&&e.target&&e.target.id==='chName'){acts.start()}
});

function toggleFull(){
  try{
    const d=document,el=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
    const f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(f){const r=f.call(el);if(r&&r.catch)r.catch(()=>{toast('المتصفح لم يسمح بملء الشاشة هنا.')})}
    else toast('على الآيفون: أضف اللعبة إلى الشاشة الرئيسية لتلعب بملء الشاشة.');
  }catch(e){}
}
function goFull(){
  try{
    const d=document,el=d.documentElement;
    if(!d.fullscreenElement&&!d.webkitFullscreenElement){const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}}
    if(screen.orientation&&screen.orientation.lock&&Math.min(screen.width,screen.height)<700)screen.orientation.lock('portrait').catch(()=>{});
  }catch(e){}
}
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredInstall=e;if(ui.modal==='settings')renderModal()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('تم تثبيت اللعبة. تقدر تلعبها بدون إنترنت.','gold')});
if(PWA&&'serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
document.addEventListener('contextmenu',(e)=>{if(!(e.target&&e.target.tagName==='INPUT'))e.preventDefault()});
document.addEventListener('gesturestart',(e)=>e.preventDefault());
(function logos(){
  const src=document.getElementById('logoImg');if(!src)return;
  document.querySelectorAll('img[data-logo]').forEach((i)=>{i.src=src.src});
  const lk=document.createElement('link');lk.rel='icon';lk.href=src.src;document.head.appendChild(lk);
})();
loadCfg();applyCfg();tutLoop();
const saved=load();
S=saved||newState();
if(!S.heat||!S.tasks)freshWorld();
ui.menu=true;renderAll();

/* ---------- loading screen ---------- */
(function bootScreen(){
  const boot=$('#boot'),app=$('#app'),ov=$('#overlay');
  if(!boot)return;
  app.inert=true;ov.inert=true;
  const tips=['الساعة الذهبية بين 6 و10 مساءً ترفع المشاهدات','العنوان المبالغ فيه ينفع، لكنه يضر سمعتك','اضبط الميزانية والتحضير قبل أن تبدأ الفيديو','استرح قبل أن تنفد طاقتك','ردّ على المحبين، وتجاهل السبام','اختر موضوعًا ساخنًا يناسب نوع فيديوك'];
  const tip=$('#bootTip'),fill=$('#bootFill'),subs=$('#bootSubs'),go=$('#bootGo');
  let ti=0,p=0,fontsOk=false,loaded=document.readyState==='complete';const t0=Date.now();
  window.addEventListener('load',()=>{loaded=true});
  tip.textContent=tips[0];
  const tipTimer=setInterval(()=>{ti=(ti+1)%tips.length;tip.textContent=tips[ti]},1500);
  const fr=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  Promise.race([fr,new Promise((r)=>setTimeout(r,2500))]).then(()=>{fontsOk=true});
  const iv=setInterval(()=>{
    let target=Math.min(100,(Date.now()-t0)/900*100);
    if(!(fontsOk&&loaded))target=Math.min(target,92);
    p=Math.max(p,target);
    fill.style.width=p+'%';
    subs.textContent=fmt(Math.round(100000*Math.pow(p/100,2)));
    if(p>=100){
      clearInterval(iv);clearInterval(tipTimer);
      tip.textContent='الاستوديو جاهز. الكاميرا تعمل.';
      go.hidden=false;go.focus();
    }
  },40);
  function finish(){
    ov.inert=false;
    boot.classList.add('out');
    setTimeout(()=>{if(boot.parentNode)boot.parentNode.removeChild(boot)},420);
    showMenu();
  }
  go.addEventListener('click',()=>{goFull();finish()});
})();
})();
